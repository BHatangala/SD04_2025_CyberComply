<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Account Deletion</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #101726;
        }

        .custom-btn {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            background-color: #a2b8c8;
            border: none;
            color: #123456;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .custom-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .custom-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .right-wave {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .fade-enter-active,
        .fade-leave-active {
            transition: opacity 0.3s ease;
        }

        .fade-enter-from,
        .fade-leave-to {
            opacity: 0;
        }

    </style>
</head>

<body class="h-screen w-full flex flex-col text-white overflow-hidden relative">

    <div id="app" class="h-full w-full flex flex-col relative z-10">

        <div class="flex-1 flex items-center justify-center px-4">
            <div class="w-full max-w-md text-center space-y-8">

                <div class="space-y-2 mb-8">
                    <h2 class="text-5xl font-medium tracking-tight">Confirm Account Deletion</h2>
                    <p class="text-gray-400 text-sm tracking-wide">
                        Enter the verification code sent to your email to permanently delete your account. This action cannot be undone.
                    </p>
                </div>

                <form @submit.prevent class="space-y-6 text-left w-3/4 mx-auto" novalidate>

                    <transition name="fade">
                        <div v-if="message.text" :class="[
                            'text-sm p-3 mb-6 rounded text-center shadow-lg border',
                            message.type === 'error'
                                ? 'bg-gray-200 text-red-600 border-red-400'
                                : 'bg-green-600 text-white border-green-400'
                        ]">
                            {{ message.text }}
                        </div>
                    </transition>

                    <div class="w-full mx-auto space-y-6">
                        <otp-verification
                            :email="email"
                            mode="delete"
                            @verified="handleDeleteVerified">
                        </otp-verification>

                        <div class="text-center pt-2">
                            <a href="profile.html"
                                class="text-xs text-gray-400 hover:text-white transition-colors tracking-wide">
                                &larr; Back to Profile
                            </a>
                        </div>    
                    </div>

                </form>
            </div>
        </div>
    </div>

    <img src="img2.png" alt="Decorative Wave Right" class="right-wave">

    <script src="otp_component.js"></script>

    <script>
        const { createApp, reactive, ref } = Vue;

        const app = createApp({
            setup() {
                const email = ref(sessionStorage.getItem("userEmail") || "");
                const message = reactive({ text: "", type: "" });

                const initialDeleteMessage = sessionStorage.getItem("deleteAccountMessage");
                if (initialDeleteMessage) {
                    message.text = initialDeleteMessage;
                    message.type = "success";
                    sessionStorage.removeItem("deleteAccountMessage");
                }

                const setMessage = (type, text) => {
                    message.type = type;
                    message.text = text;
                };

                // Protect page if user opened it directly without login
                if (!email.value) {
                    setMessage("error", "Your session has expired. Redirecting to login...");

                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 1500);

                    return;
                }

                const handleDeleteVerified = async (deleteToken) => {
                    message.text = "";

                    try {
                        const response = await fetch("http://127.0.0.1:8000/api/delete-account/", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                delete_token: deleteToken,
                                reason: sessionStorage.getItem('deleteAccountReason') || ''
                            })
                        });

                        const deleteData = await response.json();

                        if (!response.ok) {
                            setMessage("error", deleteData.detail || "Failed to delete account.");
                            return;
                        }

                        setMessage('success', 'Account deleted successfully. Redirecting...');
                        sessionStorage.removeItem('deleteAccountReason');
                        sessionStorage.clear();
                        localStorage.clear();

                        setTimeout(() => {
                            window.location.href = 'welcome.html';
                        }, 1800);

                    } catch (error) {
                        console.error('Error deleting account:', error);
                        setMessage('error', 'Something went wrong while deleting the account.');
                    }
                };

                return {
                    email,
                    message,
                    handleDeleteVerified
                };
            }
        });

        registerOtpComponent(app);
        app.mount("#app");
    </script>

</body>
</html>
