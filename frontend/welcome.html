<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberComply - Login Page</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.3.4/vue.global.prod.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #101726;
            color: #ffffff;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .menu-icon {
            cursor: pointer;
            font-weight: bold;
            font-size: 24px;
        }

        .login-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            cursor: pointer;
            font-size: 16px;
            letter-spacing: 1px;
            font-weight: 500;
            padding: 8px 16px;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            color: #e0e0e0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 50px 20px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .welcome-text {
            font-size: 24px;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .brand-name {
            font-size: 72px;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 100px;
        }

        .account-text {
            font-size: 18px;
            word-spacing: 4px;
            margin-bottom: 40px;
        }

        .signup-btn {
            background-color: #ffffff;
            color: #0c1420;
            border: none;
            padding: 15px 60px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .signup-btn:hover {
            background-color: #e0e0e0;
        }

        .wave-left {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 70%;
            z-index: 1;
            opacity: 1;
        }

        .wave-right {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 55%;
            z-index: 1;
            opacity: 1;
        }

        @media (max-width: 768px) {
            .brand-name {
                font-size: 48px;
                margin-bottom: 60px;
            }

            .wave-left {
                width: 60%;
            }

            .wave-right {
                width: 50%;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <!-- Removed the menu-icon with "ooo" -->
            <div></div>
            <button class="login-btn" @click="login">LOGIN</button>
        </div>

        <div class="container">
            <div class="welcome-text">WELCOME TO</div>
            <div class="brand-name">CYBERCOMPLY</div>

            <div class="account-text">DON'T HAVE AN ACCOUNT?</div>
            <button class="signup-btn" @click="signUp">Sign Up</button>
        </div>

        <!-- Wave designs -->
        <img src="img1.png" alt="Wave design left" class="wave-left">
        <img src="img2.png" alt="Wave design right" class="wave-right">
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            methods: {
                signUp() {
                    // Redirect to signup page
                    window.location.href = 'signup.html';
                },
                login() {
                    console.log('Login button clicked!');
                    alert('Login functionality would be implemented here');
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
