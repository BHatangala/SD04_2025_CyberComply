<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberComply - User Support</title>

    <!-- =========================================================
         VUE 3 (CDN)
         ========================================================= -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3.3.4/dist/vue.global.js"></script>

    <style>
      /* =========================================================
         GLOBAL RESET AND BASE THEME
         ========================================================= */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Arial", sans-serif;
        background-color: #101726;
        color: #ffffff;
        overflow-x: hidden;
        overflow-y: auto;
      }

      #app {
        position: relative;
        min-height: 100vh;
      }

      /* =========================================================
         BACKGROUND DESIGN LAYER
         ========================================================= */
      .bg-design {
        position: fixed;
        inset: 0;
        background-image: url("img6.png");
        background-repeat: no-repeat;
        background-size: cover;
        background-position: left center;
        z-index: 0;
        pointer-events: none;
        opacity: 0.85;
      }

      /* =========================================================
         TOP HEADER
         ========================================================= */
      .top-header {
        background-color: #1a2845;
        padding: 15px 30px;
        display: flex;
        align-items: center;
        position: relative;
        z-index: 100;
      }

      .menu-icon {
        cursor: pointer;
        font-size: 24px;
        color: #8b9dc3;
        transition: color 0.3s;
      }

      .menu-icon:hover {
        color: #ffffff;
      }

      .user-profile {
        position: absolute;
        right: 30px;
        width: 50px;
        height: 50px;
        background-color: #ffffff;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 3px solid #2a3f5f;
        transition: transform 0.3s, border-color 0.3s;
        z-index: 110;
      }

      .user-profile:hover {
        transform: scale(1.05);
        border-color: #4a8fe7;
      }

      .user-profile svg {
        width: 30px;
        height: 30px;
        fill: #1a2845;
      }

      /* =========================================================
         BACK NAVIGATION
         ========================================================= */
      .back-arrow {
        position: absolute;
        left: 30px;
        top: 80px;
        cursor: pointer;
        font-size: 32px;
        color: #8b9dc3;
        transition: all 0.3s;
        font-weight: 300;
        z-index: 95;
      }

      .back-arrow.shifted {
        left: 310px;
      }

      .back-arrow:hover {
        color: #ffffff;
      }

      /* =========================================================
         SIDEBAR NAVIGATION
         ========================================================= */
      .sidebar {
        position: absolute;
        left: 0;
        top: 60px;
        width: 280px;
        height: calc(100vh - 60px);
        background-color: #0d1420;
        transform: translateX(-100%);
        transition: transform 0.3s ease-in-out;
        z-index: 90;
        overflow-y: auto;
        padding: 20px 0;
        box-shadow: 4px 0 10px rgba(0, 0, 0, 0.3);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-icon-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0px 10px 15px 10px;
        margin-bottom: 20px;
        border-bottom: 2px solid #1a2845;
      }

      .sidebar-icon {
        width: 45px;
        height: 45px;
        background-color: #1a2845;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s;
      }

      .sidebar-icon:hover {
        background-color: #2a4a7c;
        transform: scale(1.05);
      }

      .sidebar-icon svg {
        width: 22px;
        height: 22px;
        fill: #8b9dc3;
        transition: fill 0.3s;
      }

      .sidebar-icon:hover svg {
        fill: #ffffff;
      }

      .search-container {
        padding: 0 20px 20px;
        display: none;
      }

      .search-container.active {
        display: block;
      }

      .search-input {
        width: 100%;
        padding: 10px 15px;
        background-color: #1a2845;
        border: 2px solid #2a4a7c;
        border-radius: 8px;
        color: #ffffff;
        font-size: 14px;
        transition: border-color 0.3s;
      }

      .search-input:focus {
        outline: none;
        border-color: #4a8fe7;
      }

      .search-input::placeholder {
        color: #6b7a99;
      }

      .sidebar-section {
        margin-bottom: 30px;
      }

      .sidebar-header {
        padding: 10px 20px;
        font-size: 11px;
        font-weight: 600;
        color: #6b7a99;
        letter-spacing: 1.5px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .sidebar-header svg {
        width: 14px;
        height: 14px;
        fill: #6b7a99;
      }

      .sidebar-item {
        padding: 12px 20px;
        color: #c5d0e6;
        cursor: pointer;
        transition: all 0.2s;
        border-left: 3px solid transparent;
        font-size: 14px;
      }

      .sidebar-item:hover {
        background-color: #1a2845;
        border-left-color: #4a8fe7;
        color: #ffffff;
      }

      .no-results {
        padding: 12px 20px;
        color: #6b7a99;
        font-size: 12px;
        font-style: italic;
      }

      /* =========================================================
         SCROLLBAR STYLING (SIDEBAR)
         ========================================================= */
      .sidebar::-webkit-scrollbar {
        width: 6px;
      }

      .sidebar::-webkit-scrollbar-track {
        background: #0d1420;
      }

      .sidebar::-webkit-scrollbar-thumb {
        background: #2a4a7c;
        border-radius: 3px;
      }

      .sidebar::-webkit-scrollbar-thumb:hover {
        background: #4a8fe7;
      }

      /* =========================================================
         RESPONSIVE BEHAVIOUR
         (REMOVED: mobile/tablet support)
         ========================================================= */

      /* =========================================================
         MAIN CONTENT WRAPPER
         ========================================================= */
      .support-content {
        position: relative;
        z-index: 1;
        padding: 30px 80px;
        min-height: calc(100vh - 60px);
        transition: margin-left 0.3s ease-in-out;
      }

      .support-content.shifted {
        margin-left: 280px;
      }

      .page-title {
        font-size: 34px;
        font-weight: 500;
        letter-spacing: 2px;
      }

      .support-intro {
        margin-top: 12px;
        color: #c5d0e6;
        line-height: 1.7;
        max-width: 920px;
        font-size: 14px;
      }

      .support-sections {
        margin-top: 18px;
        max-width: 980px;
      }

      /* =========================================================
         SUPPORT SLIDER / CARDS
         ========================================================= */
      .support-slider {
        position: relative;
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid rgba(96, 122, 146, 0.45);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.35);
        min-height: 260px;
      }

      .support-section-card {
        position: relative;
        padding: 26px 26px 20px;
        min-height: 260px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: transform 0.4s ease;
      }

      .support-section-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 20% 10%,
          rgba(255, 255, 255, 0.18),
          rgba(255, 255, 255, 0) 55%
        );
        pointer-events: none;
      }

      .support-section-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12),
          0 18px 45px rgba(74, 143, 231, 0.25);
      }

      .slide-title {
        position: relative;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 1px;
        z-index: 1;
      }

      .slide-desc {
        position: relative;
        margin-top: 10px;
        color: rgba(255, 255, 255, 0.92);
        line-height: 1.75;
        font-size: 14px;
        max-width: 820px;
        z-index: 1;
      }

      .slide-desc strong {
        display: block;
        font-size: 17px;
        font-weight: 800;
      }

      .slide-footer {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-top: 50px;
        z-index: 1;
      }

      .dots {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.25);
        cursor: pointer;
        transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      }

      .dot:hover {
        transform: scale(1.15);
        border-color: rgba(255, 255, 255, 0.55);
      }

      .dot.active {
        background: rgba(255, 255, 255, 0.95);
        border-color: rgba(255, 255, 255, 0.95);
      }

      .action-btn {
        padding: 10px 16px;
        background: rgba(13, 20, 32, 0.55);
        border: 2px solid rgba(255, 255, 255, 0.25);
        border-radius: 12px;
        color: #ffffff;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.25s ease;
        white-space: nowrap;
      }

      .action-btn:hover {
        border-color: rgba(255, 255, 255, 0.75);
        transform: translateY(-1px);
      }

      /* =========================================================
         SLIDE BACKGROUND THEMES
         ========================================================= */
      .bg-about {
        background-color: #113961;
      }

      .bg-manual {
        background-color: #204368;
      }

      .bg-faq {
        background-color: #2f4e6c;
      }

      /* =========================================================
         TRANSITIONS
         ========================================================= */
      .fade-enter-active,
      .fade-leave-active {
        transition: opacity 220ms ease, transform 220ms ease;
      }

      .fade-enter-from {
        opacity: 0;
        transform: translateY(6px);
      }

      .fade-leave-to {
        opacity: 0;
        transform: translateY(-6px);
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div class="bg-design"></div>

      <!-- =========================================================
           TOP BAR
           ========================================================= -->
      <div class="top-header">
        <div class="menu-icon" @click="toggleSidebar">●●●</div>

        <div class="user-profile" @click="showProfile" title="User Profile">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
            />
          </svg>
        </div>
      </div>

      <!-- =========================================================
           BACK NAVIGATION
           ========================================================= -->
      <div class="back-arrow" :class="{ shifted: sidebarOpen }" @click="onBack">←</div>

      <!-- =========================================================
           SIDEBAR
           ========================================================= -->
      <div class="sidebar" :class="{ open: sidebarOpen }">
        <div class="sidebar-icon-bar">
          <div class="sidebar-icon" @click="toggleSearch" title="Search documents">
            <svg viewBox="0 0 24 24">
              <path
                d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
              />
            </svg>
          </div>

          <div class="sidebar-icon" @click="goToHome" title="Start new analysis">
            <svg viewBox="0 0 24 24">
              <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
            </svg>
          </div>
        </div>

        <div class="search-container" :class="{ active: searchActive }">
          <input
            type="text"
            class="search-input"
            v-model="searchQuery"
            placeholder="Search documents..."
            @input="filterReports"
          />
        </div>

        <div class="sidebar-section">
          <div class="sidebar-header">
            <svg viewBox="0 0 24 24">
              <path
                d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"
              />
            </svg>
            LAST 7 DAYS
          </div>

          <div v-if="filteredLast7Days.length === 0" class="no-results">No results to display</div>

          <div v-else>
            <div
              v-for="report in filteredLast7Days"
              :key="report"
              class="sidebar-item"
              @click="openReport(report)"
            >
              {{ report }}
            </div>
          </div>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-header">
            <svg viewBox="0 0 24 24">
              <path
                d="M9 11H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h-2v-2zm2-7h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"
              />
            </svg>
            LAST 30 DAYS
          </div>

          <div v-if="filteredLast30Days.length === 0" class="no-results">No results to display</div>

          <div v-else>
            <div
              v-for="report in filteredLast30Days"
              :key="report"
              class="sidebar-item"
              @click="openReport(report)"
            >
              {{ report }}
            </div>
          </div>
        </div>
      </div>

      <!-- =========================================================
           MAIN USER SUPPORT AREA
           ========================================================= -->
      <div class="support-content" :class="{ shifted: sidebarOpen }">
        <h1 class="page-title">USER SUPPORT</h1>

        <div class="support-intro">
          Looking for more information or guidance? You’re in the right place — explore our About Us, User Manual, and FAQs
          to get the help you need.
        </div>

        <div class="support-sections">
          <div class="support-slider">
            <transition name="fade" mode="out-in">
              <div
                :key="activeSupportTab"
                class="support-section-card"
                :class="{
                  'bg-about': activeSupportTab === 0,
                  'bg-manual': activeSupportTab === 1,
                  'bg-faq': activeSupportTab === 2
                }"
                @mouseenter="pauseAutoSlide"
                @mouseleave="resumeAutoSlide"
              >
                <div>
                  <div class="slide-title">{{ supportTabs[activeSupportTab].title }}</div>
                  <div class="slide-desc" v-html="supportTabs[activeSupportTab].desc"></div>
                </div>

                <div class="slide-footer">
                  <div class="dots">
                    <div
                      v-for="(t, i) in supportTabs"
                      :key="'dot-' + i"
                      class="dot"
                      :class="{ active: activeSupportTab === i }"
                      @click="setSupportTab(i)"
                      :title="t.title"
                    ></div>
                  </div>

                  <div>
                    <button v-if="activeSupportTab === 1" class="action-btn" @click="goToUserManualPdf">
                      View User Manual (PDF)
                    </button>

                    <button v-if="activeSupportTab === 2" class="action-btn" @click="goToFaqs">
                      View FAQs Page
                    </button>
                  </div>
                </div>
              </div>
            </transition>
          </div>
        </div>
      </div>
    </div>

    <!-- =========================================================
         VUE APP SCRIPT
         ========================================================= -->
    <script>
      const { createApp } = Vue;

      createApp({
        data() {
          return {
            sidebarOpen: false,
            searchActive: false,
            searchQuery: "",

            last7Days: ["Curtin Report", "IFS Report", "Pearson Report", "Wiley Report"],
            last30Days: [
              "Example Report",
              "Example Report",
              "Example Report",
              "Example Report",
              "Example Report",
              "Example Report",
              "Example Report",
              "Example Report",
            ],
            filteredLast7Days: [],
            filteredLast30Days: [],

            activeSupportTab: 0,

            supportTabs: [
              {
                title: "ABOUT US",
                desc:
                  "<strong>Need a quick overview?</strong><br>" +
                  "CyberComply is an AI-powered, web-based compliance management platform designed to help organisations assess, monitor, and improve cybersecurity and data protection compliance. The platform primarily supports the Personal Data Protection Act No. 9 of 2022 (Sri Lanka), with optional support for ISO/IEC 27001:2022. Using Artificial Intelligence (AI) and Natural Language Processing (NLP), CyberComply analyses organisational documents, identifies compliance gaps, categorises risks, and generates audit-ready insights through a secure and user-friendly interface.",
              },
              {
                title: "USER MANUAL",
                desc:
                  "<strong>Not sure where to start?</strong><br>" +
                  "The User Manual guides you through how to use CyberComply step by step from navigating the dashboard to uploading documents and viewing reports.<br><br>" +
                  "To get started, click the “View User Manual (PDF)” button at the bottom-right of this section.",
              },
              {
                title: "FAQs",
                desc:
                  "<strong>Have a question?</strong><br>" +
                  "The FAQs section answers common questions about using CyberComply, including login issues, document uploads, report generation, and system features. It’s the fastest way to find quick answers.<br><br>" +
                  "Click the “View FAQs Page” button at the bottom-right of this section to see all frequently asked questions.",
              },
            ],

            autoSlideDelay: 4500,
            autoSlideInterval: null,
          };
        },

        mounted() {
          this.filteredLast7Days = [...this.last7Days];
          this.filteredLast30Days = [...this.last30Days];
          this.startAutoSlide();
        },

        beforeUnmount() {
          this.pauseAutoSlide();
        },

        methods: {
          toggleSidebar() {
            this.sidebarOpen = !this.sidebarOpen;
          },

          toggleSearch() {
            this.searchActive = !this.searchActive;
            if (!this.searchActive) {
              this.searchQuery = "";
              this.filterReports();
            }
          },

          filterReports() {
            const q = this.searchQuery.toLowerCase().trim();
            if (!q) {
              this.filteredLast7Days = [...this.last7Days];
              this.filteredLast30Days = [...this.last30Days];
              return;
            }
            this.filteredLast7Days = this.last7Days.filter((r) => r.toLowerCase().includes(q));
            this.filteredLast30Days = this.last30Days.filter((r) => r.toLowerCase().includes(q));
          },

          goToHome() {
            window.location.href = "home.html";
          },

          showProfile() {
            window.location.href = "profile.html";
          },

          openReport(name) {
            alert(`Opening report: ${name}\n\nReport viewing interface will be implemented soon!`);
          },

          goToUserManualPdf() {
            window.open("CyberComply - User Manual v.1.2.pdf", "_blank");
          },

          goToFaqs() {
            window.location.href = "FAQs.html";
          },

          onBack() {
            window.location.href = "home.html";
          },

          setSupportTab(i) {
            this.activeSupportTab = i;
            this.restartAutoSlide();
          },

          startAutoSlide() {
            this.pauseAutoSlide();
            this.autoSlideInterval = setInterval(() => {
              this.activeSupportTab = (this.activeSupportTab + 1) % this.supportTabs.length;
            }, this.autoSlideDelay);
          },

          pauseAutoSlide() {
            if (this.autoSlideInterval) {
              clearInterval(this.autoSlideInterval);
              this.autoSlideInterval = null;
            }
          },

          resumeAutoSlide() {
            if (!this.autoSlideInterval) {
              this.startAutoSlide();
            }
          },

          restartAutoSlide() {
            this.startAutoSlide();
          },
        },
      }).mount("#app");
    </script>
  </body>
</html>
