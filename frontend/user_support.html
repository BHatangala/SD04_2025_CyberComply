<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <script>
      const token = sessionStorage.getItem("authToken");

      if (!token || token === "null" || token === "undefined") {
        window.location.replace("login.html");
      }
    </script>     
    
    <title>CyberComply - User Support</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.3.4/dist/vue.global.js"></script>
    <script src="sidebar_component.js"></script>

    <style>
      /* Global Reset And Base Theme */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Arial", sans-serif;
        background-color: #101726;
        color: #ffffff;
        overflow-x: hidden;
        overflow-y: auto;
      }

      #app {
        position: relative;
        min-height: 100vh;
      }

      /* Background Design Layer */
      .bg-design {
        position: fixed;
        inset: 0;
        background-image: url("img6.png");
        background-repeat: no-repeat;
        background-size: cover;
        background-position: left center;
        z-index: 0;
        pointer-events: none;
        opacity: 0.85;
      }

      /* Top Header */
      .top-header {
        background-color: #1a2845;
        padding: 15px 30px;
        display: flex;
        align-items: center;
        position: fixed;       
        top: 0;                
        left: 0;                
        width: 100%;            
        z-index: 100;
      }

      .menu-icon {
        cursor: pointer;
        font-size: 24px;
        color: #8b9dc3;
        transition: color 0.3s;
      }

      .menu-icon:hover {
        color: #ffffff;
      }

      .user-profile {
        position: absolute;
        right: 30px;
        width: 50px;
        height: 50px;
        background-color: #ffffff;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 3px solid #2a3f5f;
        transition: transform 0.3s, border-color 0.3s;
        z-index: 110;
      }

      .user-profile:hover {
        transform: scale(1.05);
        border-color: #4a8fe7;
      }

      .user-profile svg {
        width: 30px;
        height: 30px;
        fill: #1a2845;
      }

      /* Back Navigation */
      .back-arrow {
        position: absolute;
        left: 30px;
        top: 80px;
        cursor: pointer;
        font-size: 32px;
        color: #8b9dc3;
        transition: all 0.3s;
        font-weight: 300;
        z-index: 95;
      }

      .back-arrow.shifted {
        left: 310px;
      }

      .back-arrow:hover {
        color: #ffffff;
      }

      /* Main Content Wrapper */
      .support-content {
        position: relative;
        z-index: 1;
        padding: 30px 80px;
        min-height: calc(100vh - 60px);
        transition: margin-left 0.3s ease-in-out;
      }

      .support-content.shifted {
        margin-left: 280px;
      }

      .page-title {
        margin-top: 55px;
        font-size: 34px;
        font-weight: bold;
        letter-spacing: 2px;
        word-spacing: 4px;
      }

      .support-intro {
        margin-top: 20px;
        color: #c5d0e6;
        line-height: 1.7;
        max-width: 920px;
        font-size: 14px;
      }

      .support-sections {
        margin-top: 35px;
        max-width: 980px;
      }

      /* Support Slider / Cards */
      .support-slider {
        position: relative;
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid rgba(96, 122, 146, 0.45);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.35);
        min-height: 260px;
      }

      .support-section-card {
        position: relative;
        padding: 26px 26px 20px;
        min-height: 260px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: transform 0.4s ease;
      }

      .support-section-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 20% 10%,
          rgba(255, 255, 255, 0.18),
          rgba(255, 255, 255, 0) 55%
        );
        pointer-events: none;
      }

      .support-section-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12),
          0 18px 45px rgba(74, 143, 231, 0.25);
      }

      .slide-title {
        position: relative;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 1px;
        z-index: 1;
      }

      .slide-desc {
        position: relative;
        margin-top: 10px;
        color: rgba(255, 255, 255, 0.92);
        line-height: 1.75;
        font-size: 14px;
        max-width: 820px;
        z-index: 1;
      }

      .slide-desc strong {
        display: block;
        font-size: 17px;
        font-weight: 800;
      }

      .slide-footer {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-top: 50px;
        z-index: 1;
      }

      .dots {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.25);
        cursor: pointer;
        transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      }

      .dot:hover {
        transform: scale(1.15);
        border-color: rgba(255, 255, 255, 0.55);
      }

      .dot.active {
        background: rgba(255, 255, 255, 0.95);
        border-color: rgba(255, 255, 255, 0.95);
      }

      .action-btn {
        padding: 10px 16px;
        background: rgba(13, 20, 32, 0.55);
        border: 2px solid rgba(255, 255, 255, 0.25);
        border-radius: 12px;
        color: #ffffff;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.25s ease;
        white-space: nowrap;
      }

      .action-btn:hover {
        border-color: rgba(255, 255, 255, 0.75);
        transform: translateY(-1px);
      }

      /* Slide Background Themes */
      .bg-about {
        background-color: #113961;
      }

      .bg-manual {
        background-color: #204368;
      }

      .bg-faq {
        background-color: #2f4e6c;
      }

      /* Transitions */
      .fade-enter-active,
      .fade-leave-active {
        transition: opacity 220ms ease, transform 220ms ease;
      }

      .fade-enter-from {
        opacity: 0;
        transform: translateY(6px);
      }

      .fade-leave-to {
        opacity: 0;
        transform: translateY(-6px);
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div class="bg-design"></div>

      <!-- Top Bar -->
      <div class="top-header">
        <div class="menu-icon" @click="sidebarOpen = !sidebarOpen">●●●</div>

        <div class="user-profile" @click="showProfile" title="User Profile">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
            />
          </svg>
        </div>
      </div>

      <!-- Back Navigation -->
      <div class="back-arrow" :class="{ shifted: sidebarOpen }" @click="onBack">←</div>

      <!-- Sidebar -->
      <cybercomply-sidebar
        :sidebar-open="sidebarOpen"
        @toggle="sidebarOpen = !sidebarOpen"
      ></cybercomply-sidebar>

      <!-- Main User Support Area -->
      <div class="support-content" :class="{ shifted: sidebarOpen }">
        <h1 class="page-title">USER SUPPORT</h1>

        <div class="support-intro">
          Looking for more information or guidance? You’re in the right place — explore our About Us, User Manual, and FAQs
          to get the help you need.
        </div>

        <div class="support-sections">
          <div class="support-slider">
            <transition name="fade" mode="out-in">
              <div
                :key="activeSupportTab"
                class="support-section-card"
                :class="{
                  'bg-about': activeSupportTab === 0,
                  'bg-manual': activeSupportTab === 1,
                  'bg-faq': activeSupportTab === 2
                }"
                @mouseenter="pauseAutoSlide"
                @mouseleave="resumeAutoSlide"
              >
                <div>
                  <div class="slide-title">{{ supportTabs[activeSupportTab].title }}</div>
                  <div class="slide-desc" v-html="supportTabs[activeSupportTab].desc"></div>
                </div>

                <div class="slide-footer">
                  <div class="dots">
                    <div
                      v-for="(t, i) in supportTabs"
                      :key="'dot-' + i"
                      class="dot"
                      :class="{ active: activeSupportTab === i }"
                      @click="setSupportTab(i)"
                      :title="t.title"
                    ></div>
                  </div>

                  <div>
                    <button v-if="activeSupportTab === 1" class="action-btn" @click="goToUserManualPdf">
                      View User Manual (PDF)
                    </button>

                    <button v-if="activeSupportTab === 2" class="action-btn" @click="goToFaqs">
                      View FAQs Page
                    </button>
                  </div>
                </div>
              </div>
            </transition>
          </div>
        </div>
      </div>
    </div>

    <!-- Vue App Script -->
    <script>
      const { createApp } = Vue;

      const app = createApp({
        data() {
          return {
            sidebarOpen: false,

            activeSupportTab: 0,

            supportTabs: [
              {
                title: "ABOUT US",
                desc:
                  "<strong>Need a quick overview?</strong><br>" +
                  "CyberComply is an AI-powered, web-based compliance management platform designed to help organisations assess, monitor, and improve cybersecurity and data protection compliance. The platform primarily supports the Personal Data Protection Act No. 9 of 2022 (Sri Lanka), with optional support for ISO/IEC 27001:2022. Using Artificial Intelligence (AI) and Natural Language Processing (NLP), CyberComply analyses organisational documents, identifies compliance gaps, categorises risks, and generates audit-ready insights through a secure and user-friendly interface.",
              },
              {
                title: "USER MANUAL",
                desc:
                  "<strong>Not sure where to start?</strong><br>" +
                  "The User Manual guides you through how to use CyberComply step by step from navigating the dashboard to uploading documents and viewing reports.<br><br>" +
                  "To get started, click the “View User Manual (PDF)” button at the bottom-right of this section.",
              },
              {
                title: "FAQs",
                desc:
                  "<strong>Have a question?</strong><br>" +
                  "The FAQs section answers common questions about using CyberComply, including login issues, document uploads, report generation, and system features. It’s the fastest way to find quick answers.<br><br>" +
                  "Click the “View FAQs Page” button at the bottom-right of this section to see all frequently asked questions.",
              },
            ],

            autoSlideDelay: 4500,
            autoSlideInterval: null,
          };
        },

        mounted() {
          this.startAutoSlide();
        },

        beforeUnmount() {
          this.pauseAutoSlide();
        },

        methods: {
          toggleSidebar() {
            this.sidebarOpen = !this.sidebarOpen;
          },

          goToHome() {
            window.location.href = "home.html";
          },

          showProfile() {
            window.location.href = "profile.html";
          },

          goToUserManualPdf() {
            window.open("CyberComply - User Manual v.1.3.pdf", "_blank");
          },

          goToFaqs() {
            window.location.href = "FAQs.html";
          },

          onBack() {
            window.location.href = "home.html";
          },

          setSupportTab(i) {
            this.activeSupportTab = i;
            this.restartAutoSlide();
          },

          startAutoSlide() {
            this.pauseAutoSlide();
            this.autoSlideInterval = setInterval(() => {
              this.activeSupportTab = (this.activeSupportTab + 1) % this.supportTabs.length;
            }, this.autoSlideDelay);
          },

          pauseAutoSlide() {
            if (this.autoSlideInterval) {
              clearInterval(this.autoSlideInterval);
              this.autoSlideInterval = null;
            }
          },

          resumeAutoSlide() {
            if (!this.autoSlideInterval) {
              this.startAutoSlide();
            }
          },

          restartAutoSlide() {
            this.startAutoSlide();
          },
        },
      });
      registerSidebarComponent(app);
      app.mount('#app');
    </script>
  </body>
</html>
