<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #101726;
        }

        .custom-input {
            background-color: #0F3456;
            border: 1px solid #2563EB;
            color: #E2E8F0;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .custom-input:focus {
            outline: none;
            border-color: #60A5FA;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        .custom-btn {
            background-color: #BEE3F8;
            color: #000;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.25s ease;
        }

        .custom-btn:hover {
            background-color: #d6f1ff;
            transform: translateY(-1px);
        }

        /* Disabled login button styling */
        .custom-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }        

        .right-wave {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Password wrapper for eye toggle */
        .password-wrapper {
            position: relative;
        }

        /* Padding for eye icon space */
        .password-wrapper input {
            padding-right: 50px;
        }

        /* Eye icon styling */
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #cbd5e1;
        }

        .toggle-password:hover {
            color: white;
        }        
    </style>
</head>

<body class="h-screen w-full flex flex-col text-white overflow-hidden relative">

    <div id="app" class="h-full w-full flex flex-col relative z-10">

        <!-- Main Content Area -->
        <div class="flex-1 flex items-center justify-center px-4">

            <div class="w-full max-w-md text-center space-y-8">

                <!-- Step 1: Login Credentials -->
                <div v-if="step === 1">
                    <div class="space-y-2 mb-8">
                        <h1 class="text-5xl font-medium tracking-tight">Login</h1>
                        <p class="text-gray-400 text-sm tracking-wide">Sign in to continue</p>
                    </div>

                    <form @submit.prevent="handleLogin" class="space-y-6 text-left w-3/4 mx-auto" novalidate>

                        <transition name="fade">
                            <div v-if="message.text" :class="[
                                'text-sm p-3 rounded text-center shadow-lg border',
                                message.type === 'error' ? 'bg-gray-200 text-red-600 border-red-400' : 'bg-green-600 text-white border-green-400'
                            ]">
                                {{ message.text }}
                            </div>
                        </transition>

                        <div class="space-y-2">
                            <label for="email" class="text-xs font-bold tracking-widest text-gray-300 uppercase ml-1">Email</label>
                            <input id="email" v-model="form.email" type="email" placeholder="hello@reallygreatsite.com" class="custom-input w-full p-3 text-sm placeholder-gray-400" autofocus>
                        </div>

                        <div class="space-y-2">
                            <label for="password" class="text-xs font-bold tracking-widest text-gray-300 uppercase ml-1">Password</label>
                            <div class="password-wrapper">
                                <input id="password" v-model="form.password" :type="showPassword ? 'text' : 'password'" placeholder="******" class="custom-input w-full p-3 text-sm placeholder-gray-400">

                                <span class="toggle-password" @click="showPassword = !showPassword">
                                    <i :class="showPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
                                </span>  
                            </div>                              
                        </div>

                        <div class="pt-2 space-y-4 text-center">
                            <!-- Loading state for login button -->
                            <button
                                type="submit"
                                :disabled="loading"
                                class="custom-btn w-full py-3 uppercase tracking-wider text-sm shadow-lg"
                            >
                                {{ loading ? "Signing In..." : "Log In" }}
                            </button>

                            <div>
                                <a href="forgot_password.html"
                                    class="text-sm text-white font-medium hover:text-blue-300 transition-colors tracking-wide">
                                    Forgot Password?
                                </a>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- Step 2: OTP Verification -->
                <div v-if="step === 2">
                    <div class="space-y-2 mb-8">
                        <h1 class="text-5xl font-medium tracking-tight">Verify OTP</h1>
                        <p class="text-gray-400 text-sm tracking-wide">Enter the OTP sent to your email</p>
                    </div>

                    <!-- Page-level success banner (e.g. "OTP sent to ...") -->
                    <transition name="fade">
                        <div v-if="message.text" :class="[
                            'text-sm p-3 mb-4 rounded text-center shadow-lg border w-3/4 mx-auto',
                            message.type === 'error' ? 'bg-gray-200 text-red-600 border-red-400' : 'bg-green-600 text-white border-green-400'
                        ]">
                            {{ message.text }}
                        </div>
                    </transition>

                    <!-- Shared OTP component handles input, validation & verify button -->
                    <div class="w-3/4 mx-auto space-y-4">

                        <otp-verification :email="form.email" @verified="handleOtpVerified">
                        </otp-verification>

                        <div class="text-center pt-2">
                            <button @click.prevent="step = 1; message.text = ''"
                                class="text-xs text-gray-400 hover:text-white transition-colors tracking-wide">
                                &larr; Back
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Decorative Waves -->
    <img src="img2.png" alt="Decorative Wave Right" class="right-wave">

    <!-- Shared OTP component — must be loaded AFTER Vue, BEFORE the app script -->
    <script src="otp_component.js"></script>

    <script>
        const { createApp, reactive, ref } = Vue;

        const app = createApp({
            setup() {
                const form = reactive({
                    email: '',
                    password: ''
                });

                const step = ref(1); // 1: credentials | 2: otp
                const message = reactive({ text: '', type: '' });

                // Password visibility toggle
                const showPassword = ref(false);

                // Loading state for login button
                const loading = ref(false);                

                const setMessage = (type, text) => {
                    message.type = type;
                    message.text = text;
                };

                // Step 1: Login (email+password)
                const handleLogin = async () => {
                    if (loading.value) return; // prevent double login
                    message.text = '';

                    loading.value = true;

                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                    if (!form.email || !emailRegex.test(form.email)) {
                        setMessage('error', 'Please enter a valid email address.');
                        loading.value = false;
                        return;
                    }

                    if (!form.password) {
                        setMessage('error', 'Please enter your password.');
                        loading.value = false;
                        return;
                    }

                    try {
                        const response = await fetch("http://127.0.0.1:8000/api/login/", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                email: form.email.trim(),
                                password: form.password
                            })
                        });

                        const data = await response.json();

                        // Backend error handling
                        if (!response.ok) {

                            if (response.status === 401) {
                                setMessage("error", "Invalid email or password.");
                                form.password = "";
                            }
                            else if (response.status === 423) {
                                setMessage("error", data.detail);
                            }
                            else if (response.status === 400) {
                                setMessage("error", data.detail);
                            }
                            else {
                                setMessage("error", "Login failed. Please try again.");
                            }

                            loading.value = false;
                            return;
                        }

                        if (data.requires_otp) {
                            step.value = 2;
                            setMessage("success", data.detail || `OTP sent to ${form.email}`);
                            loading.value = false;
                            return;
                        }

                        setMessage("success", "Login successful! Redirecting...");

                        setTimeout(() => {
                            window.location.href = "home.html";
                        }, 1000);

                    }
                    catch (err) {
                        setMessage("error", "Cannot connect to backend server.");
                    }
                    finally {
                        // Stop loading
                        loading.value = false;
                    }
                }

                // Step 2: OTP success handler (called by otp component)
                const handleOtpVerified = () => {
                    setMessage("success", "Login successful! Redirecting...");
                    setTimeout(() => {
                        window.location.href = "home.html";
                    }, 1000);
                };

                 return {
                    form,
                    step,
                    message,
                    handleLogin,
                    handleOtpVerified,

                    loading,
                    showPassword
                }
            }
        });

        registerOtpComponent(app);
        app.mount('#app');
    </script>
</body>
</html>
