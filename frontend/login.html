<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #101726;
        }

        .custom-input {
            background-color: #0F3456;
            border: 1px solid #2563EB;
            color: #E2E8F0;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .custom-input:focus {
            outline: none;
            border-color: #60A5FA;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        .custom-btn {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            background-color: #a2b8c8;
            border: none;
            color: #123456;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .custom-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        /* Disabled login button styling */
        .custom-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }        

        .right-wave {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Password wrapper for eye toggle */
        .password-wrapper {
            position: relative;
        }

        /* Eye icon styling */
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 16px;
            color: #cbd5e1;
        }

        .toggle-password:hover {
            color: #ffffff;
        }  
        
        /* Click effect */
        .toggle-password:active {
            transform: translateY(-50%) scale(0.95);
        }

        /* Keyboard focus (accessibility) */
        .toggle-password:focus {
            outline: none;
            color: #a9c7ff;
        }

        .password-wrapper input {
            padding-right: 55px;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.25s ease;
        }

        .success-modal-content {
            line-height: 1.6;
            background: #234561;
            color: #f0f4ff;
            padding: 24px 20px;
            width: 100%;
            max-width: 360px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #90a0b5;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
            animation: popIn 0.25s ease;
        }

        .success-modal-content h3 {
            margin: 0 0 10px;
            font-size: 22px;
            color: #ffffff;
        }

        .success-modal-content p {
            margin: 0;
            font-size: 14px;
            color: #e6eef7;
            line-height: 1.5;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes popIn {
            from {
            transform: scale(0.9);
            opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        
    </style>
</head>

<body class="h-screen w-full flex flex-col text-white overflow-hidden relative">

    <div id="app" class="h-full w-full flex flex-col relative z-10">

        <!-- Main Content Area -->
        <div class="flex-1 flex items-center justify-center px-4">

            <div class="w-full max-w-md text-center space-y-8">

                <!-- Step 1: Login Credentials -->
                <div v-if="step === 1">
                    <div class="space-y-2 mb-8">
                        <h1 class="text-5xl font-medium tracking-tight">Login</h1>
                        <p class="text-gray-400 text-sm tracking-wide">Sign in to continue</p>
                    </div>

                    <form @submit.prevent="handleLogin" class="space-y-6 text-left w-3/4 mx-auto" novalidate>

                        <transition name="fade">
                            <div v-if="message.text" :class="[
                                'text-sm p-3 rounded text-center shadow-lg border',
                                message.type === 'error' ? 'bg-gray-200 text-red-600 border-red-400' : 'bg-green-600 text-white border-green-400'
                            ]">
                                {{ message.text }}
                            </div>
                        </transition>

                        <div class="space-y-2">
                            <label for="email" class="text-xs font-bold tracking-widest text-gray-300 uppercase ml-1">Email</label>
                            <input id="email" v-model="form.email" type="email" placeholder="Enter your email address" class="custom-input w-full p-3 text-sm placeholder-gray-400">
                        </div>

                        <div class="space-y-2">
                            <label for="password" class="text-xs font-bold tracking-widest text-gray-300 uppercase ml-1">Password</label>
                            <div class="password-wrapper">
                                <input id="password" v-model="form.password" :type="showPassword ? 'text' : 'password'" placeholder="Enter your password" class="custom-input w-full p-3 text-sm placeholder-gray-400">

                                <span class="toggle-password" @click="showPassword = !showPassword">
                                    <i :class="showPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
                                </span>  
                            </div>                              
                        </div>

                        <div class="pt-2 space-y-4 text-center">
                            <!-- Loading state for login button -->
                            <button
                                type="submit"
                                :disabled="loading"
                                class="custom-btn"
                            >
                                {{ loading ? "Signing In..." : "Log In" }}
                            </button>

                            <div>
                                <a href="forgot_password.html"
                                    class="text-sm text-white font-medium hover:text-blue-300 transition-colors tracking-wide">
                                    Forgot Password?
                                </a>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- Step 2: OTP Verification -->
                <div v-if="step === 2">
                    <div class="space-y-2 mb-8">
                        <h1 class="text-5xl font-medium tracking-tight">Verify OTP</h1>
                        <p class="text-gray-400 text-sm tracking-wide">Enter the OTP sent to your email</p>
                    </div>

                    <!-- Page-level success banner (e.g. "OTP sent to ...") -->
                    <transition name="fade">
                        <div v-if="message.text" :class="[
                            'text-sm p-3 mb-6 rounded text-center shadow-lg border w-3/4 mx-auto',
                            message.type === 'error' ? 'bg-gray-200 text-red-600 border-red-400' : 'bg-green-600 text-white border-green-400'
                        ]">
                            {{ message.text }}
                        </div>
                    </transition>

                    <!-- Shared OTP component handles input, validation & verify button -->
                    <div class="w-3/4 mx-auto space-y-6">

                        <otp-verification :email="form.email" @verified="handleOtpVerified">
                        </otp-verification>

                        <div class="text-center pt-2">
                            <button @click.prevent="step = 1; message.text = ''"
                                class="text-xs text-gray-400 hover:text-white transition-colors tracking-wide">
                                &larr; Back
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
        <!-- Login Success Popup -->
        <div v-if="showSuccessPopup" class="modal">
            <div class="success-modal-content">
                <h3>Login Successful</h3>
                <p>Your login was successful. Redirecting to home...</p>
            </div>
        </div>
    </div>

    <!-- Decorative Waves -->
    <img src="img2.png" alt="Decorative Wave Right" class="right-wave">

    <!-- Shared OTP component — must be loaded AFTER Vue, BEFORE the app script -->
    <script src="otp_component.js"></script>

    <script>
        const { createApp, reactive, ref } = Vue;

        const app = createApp({
            setup() {
                const form = reactive({
                    email: '',
                    password: ''
                });

                const step = ref(1); // 1: credentials | 2: otp
                const message = reactive({ text: '', type: '' });
                const showSuccessPopup = ref(false);

                // Password visibility toggle
                const showPassword = ref(false);

                // Loading state for login button
                const loading = ref(false);                

                const setMessage = (type, text) => {
                    message.type = type;
                    message.text = text;
                };

                // Step 1: Login (email+password)
                const handleLogin = async () => {
                    if (loading.value) return; // prevent double login
                    message.text = '';

                    loading.value = true;

                    const trimmedEmail = form.email.trim();

                    if (!trimmedEmail && !form.password) {
                        setMessage('error', 'Please enter your email and password.');
                        loading.value = false;
                        return;
                    }

                    if (!trimmedEmail) {
                        setMessage('error', 'Please enter your email address.')
                        loading.value = false;
                        return;
                    }

                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!emailRegex.test(trimmedEmail)) {
                        setMessage('error', 'Please enter a valid email address.');
                        loading.value = false;
                        return;
                    }    

                    if (!form.password) {
                        setMessage('error', 'Please enter your password.');
                        loading.value = false;
                        return;
                    }

                    try {
                        const response = await fetch("http://127.0.0.1:8000/api/login/", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                email: trimmedEmail,
                                password: form.password
                            })
                        });

                        const data = await response.json();

                        // Backend error handling
                        if (!response.ok) {

                            if (response.status === 401) {
                                setMessage("error", "Invalid email or password.");
                                form.password = "";
                            }
                            else if (response.status === 423) {
                                setMessage("error", data.detail);
                            }
                            else if (response.status === 400) {
                                setMessage("error", data.detail);
                            }
                            else if (response.status === 500) {
                                setMessage("error", data.detail || "Login failed. Please try again.");
                            }    
                            else {
                                setMessage("error", "Login failed. Please try again.");
                            }

                            loading.value = false;
                            return;
                        }

                        if (data.requires_otp) {
                            step.value = 2;
                            setMessage("success", data.detail || `OTP sent to ${trimmedEmail}`);
                            loading.value = false;
                            return;
                        }

                        sessionStorage.setItem("userFullName", data.full_name);
                        sessionStorage.setItem("userEmail", data.email);
                        sessionStorage.setItem("userRole", data.role);

                        message.text = "";
                        showSuccessPopup.value = true;

                        setTimeout(() => {
                            window.location.href = "home.html";
                        }, 1500);

                    }
                    catch (err) {
                        setMessage("error", "Cannot connect to backend server.");
                    }
                    finally {
                        // Stop loading
                        loading.value = false;
                    }
                }

                // Step 2: OTP success handler (called by otp component)
                const handleOtpVerified = async (data) => {
                    sessionStorage.setItem("userFullName", data.full_name);
                    sessionStorage.setItem("userEmail", data.email);
                    sessionStorage.setItem("userRole", data.role);

                    showSuccessPopup.value = false;
                    setMessage("success", "Login successful! Redirecting to home...");

                    setTimeout(() => {
                        window.location.href = "home.html";
                    }, 1500);
                };

                 return {
                    form,
                    step,
                    message,
                    handleLogin,
                    handleOtpVerified,

                    loading,
                    showPassword,
                    showSuccessPopup
                }
            }
        });

        registerOtpComponent(app);
        app.mount('#app');
    </script>
</body>
</html>
