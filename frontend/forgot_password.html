<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password Page</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #101726;
        }

        .custom-input {
            background-color: #0F3456;
            border: 1px solid #2563EB;
            color: #E2E8F0;
            transition: all 0.3s ease;
        }

        .custom-input:focus {
            outline: none;
            border-color: #60A5FA;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        .custom-btn {
            background-color: #BEE3F8;
            color: #000;
            font-weight: 600;
            transition: opacity 0.3s ease;
        }

        .custom-btn:hover {
            opacity: 0.9;
        }

        .right-wave {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .fade-enter-active,
        .fade-leave-active {
            transition: opacity 0.3s ease;
        }

        .fade-enter-from,
        .fade-leave-to {
            opacity: 0;
        }
    </style>
</head>

<body class="h-screen w-full flex flex-col text-white overflow-hidden relative">

    <div id="app" class="h-full w-full flex flex-col relative z-10">

        <!-- Main Content Area -->
        <div class="flex-1 flex items-center justify-center px-4">

            <div class="w-full max-w-md text-center space-y-8">
                <div class="space-y-2">
                    <h1 class="text-4xl font-medium tracking-tight">Forgot Password</h1>
                    <p class="text-gray-400 text-sm tracking-wide">New Password</p>
                </div>

                <form @submit.prevent class="space-y-6 text-left w-3/4 mx-auto" novalidate>

                    <!-- 3. Error/Success Message Box -->
                    <transition name="fade">
                        <div v-if="message.text" :class="[
                            'text-sm p-3 rounded text-center shadow-lg border',
                            message.type === 'error' ? 'bg-gray-200 text-red-600 border-red-400' : 'bg-green-600 text-white border-green-400'
                        ]">
                            {{ message.text }}
                        </div>
                    </transition>

                    <!-- Step 1: Email -->
                    <div v-if="step === 1" class="space-y-4">
                        <div class="space-y-2">
                            <label class="text-xs font-bold tracking-widest text-gray-300 uppercase ml-1">Email</label>
                            <input v-model="form.email" type="email" placeholder="hello@reallygreatsite.com"
                                class="custom-input w-full p-3 text-sm placeholder-gray-400" required>
                        </div>
                        <button @click.prevent="handleForgotPassword"
                            class="custom-btn w-full py-3 uppercase tracking-wider text-sm shadow-lg">
                            Send OTP
                        </button>
                    </div>

                    <!-- Step 2: OTP -->
                    <div v-if="step === 2" class="space-y-4">
                        <div class="space-y-2">
                            <label class="text-xs font-bold tracking-widest text-gray-300 uppercase ml-1">Enter
                                OTP</label>
                            <input v-model="form.otp" type="text" placeholder="123456"
                                class="custom-input w-full p-3 text-center text-lg tracking-widest placeholder-gray-400"
                                required>
                        </div>
                        <button @click.prevent="verifyOtp"
                            class="custom-btn w-full py-3 uppercase tracking-wider text-sm shadow-lg">
                            Verify OTP
                        </button>
                    </div>

                    <!-- Step 3: Password Reset -->
                    <div v-if="step === 3" class="space-y-4">
                        <div class="space-y-2">
                            <label class="text-xs font-bold tracking-widest text-gray-300 uppercase ml-1">New
                                Password</label>
                            <input v-model="form.newPassword" type="password" placeholder="******"
                                class="custom-input w-full p-3 text-sm placeholder-gray-400" required>
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-bold tracking-widest text-gray-300 uppercase ml-1">Confirm
                                Password</label>
                            <input v-model="form.confirmPassword" type="password" placeholder="******"
                                class="custom-input w-full p-3 text-sm placeholder-gray-400" required>
                        </div>
                        <button @click.prevent="resetPassword"
                            class="custom-btn w-full py-3 uppercase tracking-wider text-sm shadow-lg">
                            Reset Password
                        </button>
                    </div>

                    <div class="text-center pt-2">
                        <a href="login_page.html"
                            class="text-xs text-gray-400 hover:text-white transition-colors tracking-wide">
                            &larr; Back to Login
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Decorative Waves -->
    <img src="img2.png" alt="Decorative Wave Right" class="right-wave">

    <script>
        const { createApp, reactive, ref } = Vue;

        createApp({
            setup() {
                const form = reactive({
                    email: '',
                    otp: '',
                    newPassword: '',
                    confirmPassword: ''
                });

                const step = ref(1); // 1: Email, 2: OTP, 3: Reset Password

                const message = reactive({
                    text: '',
                    type: ''
                });

                const handleForgotPassword = async () => {
                    message.text = '';

                    // Manual Email Validation
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!form.email || !emailRegex.test(form.email)) {
                        message.type = 'error';
                        message.text = "Please enter a valid email address.";
                        return;
                    }

                    const btn = document.activeElement;
                    const originalText = btn.innerText;
                    btn.innerText = "SENDING...";
                    btn.disabled = true;

                    try {
                        // Simulate sending OTP
                        await new Promise(resolve => setTimeout(resolve, 1000));
                        console.log("OTP Sent to:", form.email);

                        // Move to OTP Step
                        step.value = 2;
                        message.type = 'success';
                        message.text = `OTP sent to ${form.email}`;

                    } catch (e) {
                        message.type = 'error';
                        message.text = "Error sending OTP. Please try again.";
                    } finally {
                        btn.innerText = originalText;
                        btn.disabled = false;
                    }
                };

                const verifyOtp = async () => {
                    message.text = '';
                    if (!form.otp) {
                        message.type = 'error';
                        message.text = "Please enter the OTP.";
                        return;
                    }

                    const btn = document.activeElement;
                    const originalText = btn.innerText;
                    btn.innerText = "VERIFYING...";
                    btn.disabled = true;

                    try {
                        // Simulate OTP verification
                        await new Promise(resolve => setTimeout(resolve, 1000));

                        // Move to Reset Password Step
                        step.value = 3;
                        message.type = 'success';
                        message.text = "OTP Verified. Please reset your password.";

                    } catch (e) {
                        message.type = 'error';
                        message.text = "Invalid OTP.";
                    } finally {
                        btn.innerText = originalText;
                        btn.disabled = false;
                    }
                };

                const resetPassword = async () => {
                    message.text = '';
                    if (!form.newPassword || !form.confirmPassword) {
                        message.type = 'error';
                        message.text = "Please enter both password fields.";
                        return;
                    }

                    if (form.newPassword !== form.confirmPassword) {
                        message.type = 'error';
                        message.text = "Passwords do not match.";
                        return;
                    }

                    const btn = document.activeElement;
                    const originalText = btn.innerText;
                    btn.innerText = "RESETTING...";
                    btn.disabled = true;

                    try {
                        // Simulate password reset
                        await new Promise(resolve => setTimeout(resolve, 1000));

                        message.type = 'success';
                        message.text = "Password Reset Successfully! Redirecting to Login...";

                        setTimeout(() => {
                            window.location.href = 'login_page.html';
                        }, 2000);

                    } catch (e) {
                        message.type = 'error';
                        message.text = "Error resetting password.";
                    } finally {
                        btn.innerText = originalText;
                        btn.disabled = false;
                    }
                };

                return { form, message, step, handleForgotPassword, verifyOtp, resetPassword };
            }
        }).mount('#app');
    </script>
</body>

</html>
