<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password Page</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #101726;
        }

        .custom-input {
            background-color: #0F3456;
            border: 1px solid #2563EB;
            color: #E2E8F0;
            transition: all 0.3s ease;
        }

        .custom-input:focus {
            outline: none;
            border-color: #60A5FA;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        .custom-btn {
            background-color: #BEE3F8;
            color: #000;
            font-weight: 600;
            transition: opacity 0.3s ease;
        }

        .custom-btn:hover {
            opacity: 0.9;
        }

        .right-wave {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .fade-enter-active,
        .fade-leave-active {
            transition: opacity 0.3s ease;
        }

        .fade-enter-from,
        .fade-leave-to {
            opacity: 0;
        }
    </style>
</head>

<body class="h-screen w-full flex flex-col text-white overflow-hidden relative">

    <div id="app" class="h-full w-full flex flex-col relative z-10">

        <!-- Main Content Area -->
        <div class="flex-1 flex items-center justify-center px-4">

            <div class="w-full max-w-md text-center space-y-8">
                <div class="space-y-2">
                    <h1 class="text-4xl font-medium tracking-tight">Forgot Password</h1>
                    <p class="text-gray-400 text-sm tracking-wide">New Password</p>
                </div>

                <form @submit.prevent class="space-y-6 text-left w-3/4 mx-auto" novalidate>

                    <!-- Page-level Error / Success message -->
                    <!-- Shown for: email errors, "OTP sent" confirmation,
                         "OTP verified" confirmation, password errors, final success -->
                    <transition name="fade">
                        <div v-if="message.text" :class="[
                                'text-sm p-3 rounded text-center shadow-lg border',
                                message.type === 'error'
                                    ? 'bg-gray-200 text-red-600 border-red-400'
                                    : 'bg-green-600 text-white border-green-400'
                            ]">
                            {{ message.text }}
                        </div>
                    </transition>

                    <!-- ── Step 1: Email ── -->
                    <div v-if="step === 1" class="space-y-4">
                        <div class="space-y-2">
                            <label class="text-xs font-bold tracking-widest text-gray-300 uppercase ml-1">Email</label>
                            <input v-model="form.email" type="email"
                                placeholder="hello@reallygreatsite.com"
                                class="custom-input w-full p-3 text-sm placeholder-gray-400" required>
                        </div>
                        <button @click.prevent="handleForgotPassword"
                            class="custom-btn w-full py-3 uppercase tracking-wider text-sm shadow-lg">
                            Send OTP
                        </button>
                    </div>

                    <!-- ── Step 2: OTP ──
                         The <otp-verification> component renders the OTP input
                         and Verify button. It handles its own inline errors
                         (wrong format etc.). When verification succeeds it emits
                         @verified, which calls handleOtpVerified() below.

                         To reuse on another page, copy these three lines and
                         write your own @verified handler:

                             <otp-verification
                                 :email="form.email"
                                 @verified="handleOtpVerified">
                             </otp-verification>
                    ── -->
                    <div v-if="step === 2">
                        <otp-verification
                            :email="form.email"
                            @verified="handleOtpVerified">
                        </otp-verification>
                    </div>

                    <!-- ── Step 3: New Password ── -->
                    <div v-if="step === 3" class="space-y-4">
                        <div class="space-y-2">
                            <label class="text-xs font-bold tracking-widest text-gray-300 uppercase ml-1">
                                New Password
                            </label>
                            <input v-model="form.newPassword" type="password" placeholder="******"
                                class="custom-input w-full p-3 text-sm placeholder-gray-400" required>
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-bold tracking-widest text-gray-300 uppercase ml-1">
                                Confirm Password
                            </label>
                            <input v-model="form.confirmPassword" type="password" placeholder="******"
                                class="custom-input w-full p-3 text-sm placeholder-gray-400" required>
                        </div>
                        <button @click.prevent="resetPassword"
                            class="custom-btn w-full py-3 uppercase tracking-wider text-sm shadow-lg">
                            Reset Password
                        </button>
                    </div>

                    <div class="text-center pt-2">
                        <a href="login.html"
                            class="text-xs text-gray-400 hover:text-white transition-colors tracking-wide">
                            &larr; Back to Login
                        </a>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <!-- Decorative Waves -->
    <img src="img2.png" alt="Decorative Wave Right" class="right-wave">

    <!-- Load shared OTP component AFTER Vue, BEFORE the app script -->
    <script src="otp_component.js"></script>

    <script>
        const { createApp, reactive, ref } = Vue;

        const app = createApp({
            setup() {
                const form = reactive({
                    email: '',
                    otp: '',
                    newPassword: '',
                    confirmPassword: ''
                });

                const step = ref(1); // 1: Email  |  2: OTP  |  3: Reset Password

                const message = reactive({ text: '', type: '' });

                const setMessage = (type, text) => {
                    message.type = type;
                    message.text = text;
                };

                // ─── Step 1: Validate email and send OTP ───────────────────────
                const handleForgotPassword = async () => {
                    message.text = '';

                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!form.email || !emailRegex.test(form.email)) {
                        setMessage('error', 'Please enter a valid email address.');
                        return;
                    }

                    const btn = document.activeElement;
                    const originalText = btn.innerText;
                    btn.innerText = 'SENDING...';
                    btn.disabled = true;

                    try {
                        // ── BACKEND INTEGRATION POINT ──────────────────────────
                        // Replace simulation with your Django send-OTP call:
                        //
                        //   await fetch('/api/send-otp/', {
                        //       method: 'POST',
                        //       headers: { 'Content-Type': 'application/json' },
                        //       body: JSON.stringify({ email: form.email })
                        //   });
                        //
                        // ── END BACKEND INTEGRATION POINT ──────────────────────
                        await new Promise(resolve => setTimeout(resolve, 1000));

                        // Show green "OTP sent" banner, then reveal OTP step
                        setMessage('success', `OTP sent to ${form.email}`);
                        step.value = 2;

                    } catch {
                        setMessage('error', 'Error sending OTP. Please try again.');
                    } finally {
                        btn.innerText = originalText;
                        btn.disabled = false;
                    }
                };

                // ─── Step 2: Called by <otp-verification @verified="..."> ──────
                // The component emits @verified once the user's OTP passes.
                // This is the only thing that differs between pages —
                // here we advance to the password reset step.
                const handleOtpVerified = () => {
                    setMessage('success', 'OTP verified. Please set your new password.');
                    step.value = 3;
                };

                // ─── Step 3: Validate passwords and reset ──────────────────────
                const resetPassword = async () => {
                    message.text = '';

                    if (!form.newPassword || !form.confirmPassword) {
                        setMessage('error', 'Please fill in both password fields.');
                        return;
                    }

                    if (form.newPassword !== form.confirmPassword) {
                        setMessage('error', 'Passwords do not match.');
                        return;
                    }

                    const btn = document.activeElement;
                    const originalText = btn.innerText;
                    btn.innerText = 'RESETTING...';
                    btn.disabled = true;

                    try {
                        // ── BACKEND INTEGRATION POINT ──────────────────────────
                        // Replace simulation with your Django reset-password call:
                        //
                        //   await fetch('/api/reset-password/', {
                        //       method: 'POST',
                        //       headers: { 'Content-Type': 'application/json' },
                        //       body: JSON.stringify({
                        //           email:       form.email,
                        //           newPassword: form.newPassword
                        //       })
                        //   });
                        //
                        // ── END BACKEND INTEGRATION POINT ──────────────────────
                        await new Promise(resolve => setTimeout(resolve, 1000));

                        setMessage('success', 'Password Reset Successfully! Redirecting to Login...');
                        setTimeout(() => { window.location.href = 'login.html'; }, 2000);

                    } catch {
                        setMessage('error', 'Error resetting password. Please try again.');
                    } finally {
                        btn.innerText = originalText;
                        btn.disabled = false;
                    }
                };

                return {
                    form, message, step,
                    handleForgotPassword, handleOtpVerified, resetPassword
                };
            }
        });

        // Register the OTP component on this app before mounting
        registerOtpComponent(app);
        app.mount('#app');
    </script>

</body>
</html>
