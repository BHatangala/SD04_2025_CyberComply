<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberComply - Recommendations</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.3.4/dist/vue.global.js"></script>
    <style>
      *{
          margin: 0;
          padding: 0;
          box-sizing: border-box;
      }

    body {
        font-family: 'Arial', sans-serif;
        background-color: #101726;
        color: #ffffff;
        overflow-x: hidden;
    }

    #app {
      position: relative;
      min-height: 100vh;
    }

    /* Top Header */
    .top-header {
      background-color: #1a2845;
      padding: 15px 30px;
      display: flex;
      align-items: center;
      position: relative;
      z-index: 100;
    }

    .menu-icon {
      cursor: pointer;
      font-size: 24px;
      color: #8b9dc3;
      transition: color 0.3s;
    }

    .menu-icon:hover {
      color: #ffffff;
    }

    /* Back Arrow */
    .back-arrow {
      position: absolute;
      left: 30px;
      top: 80px;
      cursor: pointer;
      font-size: 32px;
      color: #8b9dc3;
      transition: all 0.3s;
      font-weight: 300;
      z-index: 95;
    }

    .back-arrow.shifted {
      left: 310px;
    }

    .back-arrow:hover {
      color: #ffffff;
    }

    /* Home Button */
    .home-button {
      position: absolute;
      left: 100px;
      top: 85px;
      cursor: pointer;
      font-size: 28px;
      color: #8b9dc3;
      transition: all 0.3s;
      z-index: 95;
    }

    .home-button.shifted {
      left: 360px; /* moves along with the sidebar shift */
    }

    .home-button:hover {
      color: #ffffff;
    }

    .user-profile {
      position: absolute;
      right: 30px;
      width: 50px;
      height: 50px;
      background-color: #ffffff;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #2a3f5f;
      transition: transform 0.3s, border-color 0.3s;
    }

    .user-profile:hover {
      transform: scale(1.05);
      border-color: #4a8fe7;
    }

    .user-profile svg {
      width: 30px;
      height: 30px;
      fill: #1a2845;
    }

    /* Sidebar */
    .sidebar {
      position: absolute;
      left: 0;
      top: 60px;
      width: 280px;
      height: calc(100vh - 60px);
      background-color: #0d1420;
      transform: translateX(-100%);
      transition: transform 0.3s ease-in-out;
      z-index: 90;
      overflow-y: auto;
      padding: 20px 0;
      box-shadow: 4px 0 10px rgba(0, 0, 0, 0.3);
    }

    .sidebar.open {
      transform: translateX(0);
    }

    /* Sidebar icon bar (search + add) */
    .sidebar-icon-bar {
      display: flex;
      justify-content: space-between; /* ← THIS is what pushes icons left & right */
      align-items: center;
      padding: 0px 10px 15px 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #1a2845;
    }

    .sidebar-icon {
      width: 45px;
      height: 45px;
      background-color: #1a2845;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .sidebar-icon:hover {
      background-color: #2a4a7c;
      transform: scale(1.05);
    }

    .sidebar-icon svg {
      width: 22px;
      height: 22px;
      fill: #8b9dc3;
    }

    .sidebar-icon:hover svg {
      fill: #ffffff;
    }

    /* Search Input */
    .search-container {
      padding: 0 20px 20px;
      display: none;
    }

    .search-container.active {
      display: block;
    }

    .search-input {
      width: 100%;
      padding: 10px 15px;
      background-color: #1a2845;
      border: 2px solid #2a4a7c;
      border-radius: 8px;
      color: #ffffff;
      font-size: 14px;
      transition: border-color 0.3s;
      }

    .search-input:focus {
      outline: none;
      border-color: #4a8fe7;
    }

    .search-input::placeholder {
      color: #6b7a99;
    }

    .sidebar-section {
      margin-bottom: 30px;
    }

    .sidebar-header {
      padding: 10px 20px;
      font-size: 11px;
      font-weight: 600;
      color: #6b7a99;
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      gap: 10px;
      }

    .sidebar-header svg {
      width: 14px;
      height: 14px;
      fill: #6b7a99;
    }

    .sidebar-item {
      padding: 12px 20px;
      cursor: pointer;
      color: #c5d0e6;
    }

    .sidebar-item:hover {
      background-color: #1a2845;
      color: #ffffff;
    }
     
    .no-results {
      padding: 12px 20px;
      color: #6b7a99;
      font-size: 12px;
      font-style: italic;
    }

    /*main content*/
    .main-content {
      transition: margin-left 0.3s ease-in-out;
      padding: 60px 80px;
      position: relative;
      z-index: 1;
    }

    .main-content.shifted {
      margin-left: 280px;
    }

    /* Logo */
    .logo {
      text-align: center;
      margin-bottom: 60px;
    }

    .logo h1 {
      font-size: 48px;
      font-weight: bold;
      letter-spacing: 4px;
      color: #ffffff;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

    /* Recommendations */
    .recommendation {
      max-width: 900px;
      margin: 0 auto 25px;
      background-color: #1a2845;
      padding: 25px 30px;
      border-radius: 12px;
      border-left: 5px solid #4a8fe7;
    }

    .recommendation ul {
      margin-top: 10px;
      padding-left: 20px;
    }

    .recommendation li {
      margin-bottom: 8px;
      color: #c5d0e6;
    }

    .reference {
      font-size: 13px;
      color: #8b9dc3;
      margin-top: 6px;
    }

    /* Wavy Background */
    .wavy-background {
      position: fixed;
      bottom: 0;
      right: 0;
      width: 80%;
      z-index: 0;
      opacity: 0.7;
      pointer-events: none;
    }

    .wavy-background img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Scrollbar Styling */
    .sidebar::-webkit-scrollbar {
      width: 6px;
    }

    .sidebar::-webkit-scrollbar-track {
      background: #0d1420;
    }

    .sidebar::-webkit-scrollbar-thumb {
      background: #2a4a7c;
      border-radius: 3px;
    }

    .sidebar::-webkit-scrollbar-thumb:hover {
      background: #4a8fe7;
    }

  </style>
</head>

<body>
<div id="app">

  <!-- Top Header -->
  <div class="top-header">
      <div class="menu-icon" @click="toggleSidebar">●●●</div>
      <div class="user-profile" @click="showProfile">
          <svg viewBox="0 0 24 24">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
      </div>
  </div>

  <!-- Back Arrow -->
   <div class="back-arrow" :class="{ shifted: sidebarOpen }" @click="goBack">←
   </div>

  <!-- Home Button -->
   <div class="home-button" :class="{ shifted: sidebarOpen }" @click="goHome">
    <svg viewBox="0 0 24 24" width="30" height="30" fill="#8b9dc3">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
    </svg>
  </div>


  <!-- Sidebar -->
  <div class="sidebar" :class="{ open: sidebarOpen }">
      <!-- Icon Bar (Search and Plus) -->
      <div class="sidebar-icon-bar">
          <div class="sidebar-icon" @click="toggleSearch" title="Search documents">
              <svg viewBox="0 0 24 24">
                  <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
              </svg>
          </div>
          <div class="sidebar-icon" @click="goHome" title="Start new analysis">
              <svg viewBox="0 0 24 24">
                  <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
              </svg>
          </div>
      </div>

      <!-- Search Input (Hidden by default) -->
      <div class="search-container" :class="{ active: searchActive }">
          <input 
              type="text" 
              class="search-input" 
              v-model="searchQuery" 
              placeholder="Search documents..."
              @input="filterReports"
          >
      </div>  
    
    <div class="sidebar-section">
        <div class="sidebar-header">
            <svg viewBox="0 0 24 24">
                <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
            </svg>
            LAST 7 DAYS
        </div>
        <div v-if="filteredLast7Days.length === 0" class="no-results">
            No results to display
        </div>
        <div v-else>
          <div 
              v-for="report in filteredLast7Days" 
              :key="report"
              class="sidebar-item"
              @click="openReport(report)"
          >
              {{ report }}
          </div>
        </div>
      </div>

      <div class="sidebar-section">
          <div class="sidebar-header">
              <svg viewBox="0 0 24 24">
                  <path d="M9 11H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm2-7h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/>
              </svg>
              LAST 30 DAYS
          </div>
          <div v-if="filteredLast30Days.length === 0" class="no-results">
              No results to display
          </div>
          <div v-else>
              <div 
                  v-for="report in filteredLast30Days" 
                  :key="report"
                  class="sidebar-item"
                  @click="openReport(report)"
              >
                  {{ report }}
              </div>
          </div>
      </div>
    </div>

  <!-- Main Content -->
  <div class="main-content" :class="{ shifted: sidebarOpen }">
    <div class="logo">
      <h1>CYBERCOMPLY<br/>RECOMMENDATIONS</h1>
    </div>

    <div class="recommendation" v-for="(rec, index) in recommendations" :key="index">
      <strong>{{ rec.title }}</strong>
      <ul>
        <li v-for="point in rec.points" :key="point">{{ point }}</li>
      </ul>
      <div class="reference">{{ rec.reference }}</div>
    </div>
  </div>

  <!-- Wavy Background -->
  <div class="wavy-background">
      <img src="img2.png" alt="Wavy Design">
  </div> 

</div>

<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      sidebarOpen: false,
      searchActive: false,
      searchQuery: '',
      last7Days: ['Curtin Report', 'IFS Report', 'Pearson Report', 'Wiley Report'],
      last30Days: ['Example Report', 'Example Report', 'Example Report', 'Example Report', 'Example Report', 'Example Report', 'Example Report', 'Example Report'],
      filteredLast7Days: [],
      filteredLast30Days: [],
      recommendations: [
        {
          title: 'Implement stronger access controls',
          points: [
            'Use role-based access control (RBAC)',
            'Enforce least privilege principles'
          ],
          reference: 'As mentioned in page 15, line 18 of the Data Protection Act'
        },
        {
          title: 'Improve data encryption practices',
          points: [
            'Encrypt sensitive data at rest',
            'Use TLS for data in transit'
          ],
          reference: 'As mentioned in page 22, line 7 of the Data Protection Act'
        }
      ]
    }
  },
  mounted() {
    //Initialize filtered lists
    this.filteredLast7Days = [...this.last7Days];
    this.filteredLast30Days = [...this.last30Days];
  },
  methods: {
    toggleSidebar() {
      this.sidebarOpen = !this.sidebarOpen;
    },
    toggleSearch() {
      this.searchActive = !this.searchActive;
      if (!this.searchActive) {
          this.searchQuery = '';
          this.filterReports();
      }
    },
    showProfile() {
      window.location.href = 'profile.html';
    },
    goBack() {
      window.location.href = 'document_analysis.html';
    },
    goHome() {
      window.location.href = 'home.html';
    },
    filterReports() {
      const query = this.searchQuery.toLowerCase();
      if (query === '') {
          this.filteredLast7Days = [...this.last7Days];
          this.filteredLast30Days = [...this.last30Days];
      } else {
          this.filteredLast7Days = this.last7Days.filter(report => 
              report.toLowerCase().includes(query)
          );
          this.filteredLast30Days = this.last30Days.filter(report => 
              report.toLowerCase().includes(query)
          );
      }
    },
    openReport(reportName) {
      window.location.href = `report_viewing.html?report=${encodeURIComponent(reportName)}`;
    }
  }
}).mount('#app');
</script>

</body>
</html>
