<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberComply - Recommendations</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.3.4/dist/vue.global.js"></script>
    <script src="sidebar_component.js"></script>
    <style>
      *{
          margin: 0;
          padding: 0;
          box-sizing: border-box;
      }

    body {
        font-family: 'Arial', sans-serif;
        background-color: #101726;
        color: #ffffff;
        overflow-x: hidden;
    }

    #app {
      position: relative;
      min-height: 100vh;
    }

    /* Top Header */
    .top-header {
      background-color: #1a2845;
      padding: 15px 30px;
      display: flex;
      align-items: center;
      position: fixed;       
      top: 0;                
      left: 0;                
      width: 100%;            
      z-index: 100;
    }

    .menu-icon {
      cursor: pointer;
      font-size: 24px;
      color: #8b9dc3;
      transition: color 0.3s;
    }

    .menu-icon:hover {
      color: #ffffff;
    }

    /* Back Arrow */
    .back-arrow {
      position: absolute;
      left: 30px;
      top: 80px;
      cursor: pointer;
      font-size: 32px;
      color: #8b9dc3;
      transition: all 0.3s;
      font-weight: 300;
      z-index: 95;
    }

    .back-arrow::after {
      content: "Back to Previous Page";
      position: absolute;
      left: 0px;
      top: 150%;
      transform: translateY(-50%);
      background: #1a2845;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
  }

  .back-arrow:hover::after {
      opacity: 1;
  }

    .back-arrow.shifted {
      left: 310px;
    }

    .back-arrow:hover {
      color: #ffffff;
    }

    /* Home Button */
    .home-button {
      position: absolute;
      left: 100px;
      top: 85px;
      cursor: pointer;
      font-size: 28px;
      color: #8b9dc3;
      transition: all 0.3s;
      z-index: 95;
    }

    .home-button::after {
      content: "Back to Home Page";
      position: absolute;
      left: 10px;
      top: 150%;
      transform: translateY(-50%);
      background: #1a2845;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
  }

  .home-button:hover::after {
      opacity: 1;
  }

    .home-button.shifted {
      left: 360px; 
    }

    .home-button:hover {
      color: #ffffff;
    }

    .user-profile {
      position: absolute;
      right: 30px;
      width: 50px;
      height: 50px;
      background-color: #ffffff;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #2a3f5f;
      transition: transform 0.3s, border-color 0.3s;
    }

    .user-profile:hover {
      transform: scale(1.05);
      border-color: #4a8fe7;
    }

    .user-profile svg {
      width: 30px;
      height: 30px;
      fill: #1a2845;
    }

    /*main content*/
    .main-content {
      transition: margin-left 0.3s ease-in-out;
      padding: 60px 80px;
      position: relative;
      z-index: 1;
    }

    .main-content.shifted {
      margin-left: 280px;
    }

    /* Logo */
    .logo {
      text-align: center;
      margin-top: 55px;
      margin-bottom: 60px;
    }

    .logo h1 {
      font-size: 48px;
      font-weight: bold;
      letter-spacing: 4px;
      color: #ffffff;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

    /* Recommendations */
    .recommendation {
      max-width: 900px;
      margin: 0 auto 25px;
      background-color: #1a2845;
      padding: 25px 30px;
      border-radius: 12px;
      border-left: 5px solid #4a8fe7;
    }

    .recommendation ul {
      margin-top: 10px;
      padding-left: 20px;
    }

    .recommendation li {
      margin-bottom: 8px;
      color: #c5d0e6;
    }

    .reference {
      font-size: 13px;
      color: #8b9dc3;
      margin-top: 6px;
    }

    /* Wavy Background */
    .wavy-background {
      position: fixed;
      bottom: 0;
      right: 0;
      width: 85%;
      z-index: 0;
      opacity: 0.6;
      pointer-events: none;
    }

    .wavy-background img {
      width: 100%;
      height: auto;
      display: block;
    }

  </style>
</head>

<body>
<div id="app">

  <!-- Top Header -->
  <div class="top-header">
      <div class="menu-icon" @click="toggleSidebar">●●●</div>
      <div class="user-profile" @click="showProfile">
          <svg viewBox="0 0 24 24">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
      </div>
  </div>

  <!-- Back Arrow -->
   <div class="back-arrow" :class="{ shifted: sidebarOpen }" @click="goBack">←
   </div>

  <!-- Home Button -->
   <div class="home-button" :class="{ shifted: sidebarOpen }" @click="goHome">
    <svg viewBox="0 0 24 24" width="30" height="30" fill="#8b9dc3">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
    </svg>
  </div>

  <!-- Sidebar -->
  <cybercomply-sidebar
      :sidebar-open="sidebarOpen"
      @toggle="sidebarOpen = !sidebarOpen"
  ></cybercomply-sidebar>

  <!-- Main Content -->
  <div class="main-content" :class="{ shifted: sidebarOpen }">
    <div class="logo">
      <h1>CYBERCOMPLY<br/>RECOMMENDATIONS</h1>
    </div>

    <div class="recommendation" v-for="(rec, index) in recommendations" :key="index">
      <strong>{{ rec.title }}</strong>
      <ul>
        <li v-for="point in rec.points" :key="point">{{ point }}</li>
      </ul>
      <div class="reference">{{ rec.reference }}</div>
    </div>
  </div>

  <!-- Wavy Background -->
  <div class="wavy-background">
      <img src="img2.png" alt="Wavy Design">
  </div> 

</div>

<script>
  const { createApp } = Vue;

  const app = createApp({
    data() {
      return {
        sidebarOpen: true,
        recommendations: [
          {
            title: 'Implement stronger access controls',
            points: [
              'Use role-based access control (RBAC)',
              'Enforce least privilege principles'
            ],
            reference: 'As required under section 9(1)(a) of the Personal Data Protection Act No. 9 of 2022 (Sri Lanka)'
          },
          {
            title: 'Improve data encryption practices',
            points: [
              'Encrypt sensitive data at rest',
              'Use TLS for data in transit'
            ],
            reference: 'As required under section 9(1)(a) of the Personal Data Protection Act No. 9 of 2022 (Sri Lanka)'
          }
        ]
      }
    },
    methods: {
      toggleSidebar() {
        this.sidebarOpen = !this.sidebarOpen;
      },
      showProfile() {
        window.location.href = 'profile.html';
      },
      goBack() {
        window.location.href = 'document_analysis.html';
      },
      goHome() {
        window.location.href = 'home.html';
      }
    }
  });
  registerSidebarComponent(app);
  app.mount('#app');
</script>

</body>
</html>
