<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberComply - Profile</title>
    <!-- Vue.js 3 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3.3.4/dist/vue.global.js"></script>
    <!-- Custom OTP Component -->
    <script src="otp_component.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #101726;
            color: #ffffff;
            overflow-x: hidden;
        }

        #app {
            position: relative;
            min-height: 100vh;
        }

        /* === HEADER === */
        .top-header {
            background-color: #1a2845;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            position: relative;
            z-index: 100;
        }

        .menu-icon {
            cursor: pointer;
            font-size: 24px;
            color: #8b9dc3;
            transition: color 0.3s;
        }

        .menu-icon:hover {
            color: #ffffff;
        }

        /* Back navigation arrow */
        .back-arrow {
            position: absolute;
            left: 30px;
            top: 80px;
            cursor: pointer;
            font-size: 32px;
            color: #8b9dc3;
            transition: all 0.3s;
            font-weight: 300;
            z-index: 95;
        }

        /* Tooltip for back arrow */
        .back-arrow::after {
            content: "Back to Previous Page";
            position: absolute;
            left: 40px;
            top: 50%;
            transform: translateY(-50%);
            background: #1a2845;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .back-arrow:hover::after {
            opacity: 1;
        }

        .back-arrow.shifted {
            left: 310px;
        }

        .back-arrow:hover {
            color: #ffffff;
        }

        /* User profile avatar in header */
        .user-profile {
            position: absolute;
            right: 30px;
            width: 50px;
            height: 50px;
            background-color: #ffffff;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #2a3f5f;
            transition: transform 0.3s, border-color 0.3s;
        }

        .user-profile:hover {
            transform: scale(1.05);
            border-color: #4a8fe7;
        }

        .user-profile svg {
            width: 30px;
            height: 30px;
            fill: #1a2845;
        }

        /* === SIDEBAR STYLES === */
        .sidebar {
            position: absolute;
            left: 0;
            top: 60px;
            width: 280px;
            height: calc(100vh - 60px);
            background-color: #0d1420;
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
            z-index: 90;
            overflow-y: auto;
            padding: 20px 0;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.3);
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-section {
            margin-bottom: 30px;
        }

        .sidebar-header {
            padding: 10px 20px;
            font-size: 11px;
            font-weight: 600;
            color: #6b7a99;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header svg {
            width: 14px;
            height: 14px;
            fill: #6b7a99;
        }

        .sidebar-item {
            padding: 12px 20px;
            color: #c5d0e6;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            font-size: 14px;
        }

        .sidebar-item:hover {
            background-color: #1a2845;
            border-left-color: #4a8fe7;
            color: #ffffff;
        }

        /* Icon bar in sidebar */
        .sidebar-icon-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0px 10px 15px 10px; 
            margin-bottom: 20px;
            border-bottom: 2px solid #1a2845;
        }

        .sidebar-icon {
            width: 45px;
            height: 45px;
            background-color: #1a2845;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .sidebar-icon:hover {
            background-color: #2a4a7c;
            transform: scale(1.05);
        }

        .sidebar-icon svg {
            width: 22px;
            height: 22px;
            fill: #8b9dc3;
            transition: fill 0.3s;
        }

        .sidebar-icon:hover svg {
            fill: #ffffff;
        }

        /* Search Input Container */
        .search-container {
            padding: 0 20px 20px;
            display: none;
        }

        .search-container.active {
            display: block;
        }

        .search-input {
            width: 100%;
            padding: 10px 15px;
            background-color: #1a2845;
            border: 2px solid #2a4a7c;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #4a8fe7;
        }

        .search-input::placeholder {
            color: #6b7a99;
        }

        .no-results {
            padding: 12px 20px;
            color: #6b7a99;
            font-size: 12px;
            font-style: italic;
        }

        /* === MAIN CONTENT AREA === */
        .main-content {
            transition: margin-left 0.3s ease-in-out;
            padding: 80px 80px 60px;
            position: relative;
            z-index: 1;
        }

        .main-content.shifted {
            margin-left: 280px;
        }

        /* Profile avatar */
        .profile-avatar {
            text-align: center;
            margin-bottom: 28px;
        }

        .profile-avatar svg {
            width: 120px;
            height: 120px;
            fill: #ffffff;
            filter: drop-shadow(0 4px 12px rgba(74, 143, 231, 0.4));
        }

        /* Profile Details Section */
        .profile-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px;
            background: linear-gradient(135deg, #1e3a5f 0%, #2a4a7c 100%);
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(74, 143, 231, 0.2);
        }

        .profile-field {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .profile-field label {
            width: 150px;
            color: #c5d0e6;
            font-weight: 500;
        }

        .profile-field span {
            color: #ffffff;
        }

        /* Profile action buttons */
        .profile-actions {
            display: flex;
            justify-content: space-between;
            gap: 100px;
            margin-top: 40px;
        }

        .action-button {
            flex: 1;
            min-width: 0;
            padding: 14px 20px;
            background-color: #ffffff;
            color: #1a2845;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            text-align: center;
        }

        .action-button:hover {
            background-color: #f0f0f0;
            transform: translateY(-2px);
        }

        .action-button.delete {
            background-color: #ffffff;
            color: #1a2845;
        }

        /* Logout Button */
        .logout-button {
            position: absolute;
            top: 15px;
            right: 100px;
            padding: 8px 24px;
            background-color: #ffffff;
            color: #1a2845;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .logout-button:hover {
            background-color: #f0f0f0;
        }

        /* === BACKGROUND ELEMENTS === */
        .wavy-background {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 70%;
            z-index: 0;
            opacity: 0.7;
            pointer-events: none;
        }

        .wavy-background img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* === Scrollbar Styling === */
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: #0d1420;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: #2a4a7c;
            border-radius: 3px;
        }

        .sidebar::-webkit-scrollbar-thumb:hover {
            background: #4a8fe7;
        }

        /* 2FA checkbox */
        .twofa-checkbox {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0 32px;
            font-size: 16px;
            color: #c5d0e6;
        }

        .twofa-checkbox input[type="checkbox"] {
            appearance: none;
            width: 20px;
            height: 20px;
            background: #1e3a5f;
            border: 2px solid #4a8fe7;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }

        .twofa-checkbox input[type="checkbox"]:checked {
            background: #4a8fe7;
            border-color: #4a8fe7;
        }

        .twofa-checkbox input[type="checkbox"]:checked::after {
            content: "✓";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .twofa-checkbox label {
            cursor: pointer;
            user-select: none;
        }

        /* === MODAL STYLES === */
        .otp-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            backdrop-filter: blur(4px);
        }

        .otp-modal {
            background: linear-gradient(135deg, #1e3a5f 0%, #2a4a7c 100%);
            border-radius: 16px;
            padding: 40px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            text-align: center;
        }

        .otp-modal h3 {
            margin-bottom: 24px;
            font-size: 22px;
            color: #ffffff;
        }

        .otp-modal p {
            color: #c5d0e6;
            margin-bottom: 28px;
            font-size: 15px;
        }

        /* === RESPONSIVE DESIGN === */
        @media screen and (max-width: 1200px) {
            .sidebar {
                position: fixed;
                box-shadow: 4px 0 20px rgba(0, 0, 0, 0.5);
            }
            
            .main-content.shifted {
                margin-left: 0;  /* Don't push content on smaller screens */
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Top Header Section -->
        <div class="top-header">
            <div class="menu-icon" @click="toggleSidebar">●●●</div>
            <button class="logout-button" @click="logout">LOGOUT</button>
        </div>

        <!-- Back Arrow Navigation -->
        <div class="back-arrow" :class="{ shifted: sidebarOpen }" @click="goToHome">←</div>

        <!-- Sidebar Navigation -->
        <div class="sidebar" :class="{ open: sidebarOpen }">
            <!-- Icon Bar (with Search and Plus) -->
            <div class="sidebar-icon-bar">
                <div class="sidebar-icon" @click="toggleSearch" title="Search documents">
                    <svg viewBox="0 0 24 24">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                </div>
                <div class="sidebar-icon" @click="goToHome" title="Start new analysis">
                    <svg viewBox="0 0 24 24">
                        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                    </svg>
                </div>
            </div>

            <!-- Search Input Field (Hidden by default) -->
            <div class="search-container" :class="{ active: searchActive }">
                <input 
                    type="text" 
                    class="search-input" 
                    v-model="searchQuery" 
                    placeholder="Search documents..."
                    @input="filterReports"
                >
            </div>

            <!-- Last 7 Days Reports Section -->
            <div class="sidebar-section">
                <div class="sidebar-header">
                    <svg viewBox="0 0 24 24">
                        <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
                    </svg>
                    LAST 7 DAYS
                </div>
                <div v-if="filteredLast7Days.length === 0" class="no-results">
                    No results to display
                </div>
                <div v-else>
                    <div 
                        v-for="report in filteredLast7Days" 
                        :key="report"
                        class="sidebar-item"
                        @click="openReport(report)"
                    >
                        {{ report }}
                    </div>
                </div>
            </div>

            <!-- Last 30 Days Reports Section -->
            <div class="sidebar-section">
                <div class="sidebar-header">
                    <svg viewBox="0 0 24 24">
                        <path d="M9 11H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm2-7h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/>
                    </svg>
                    LAST 30 DAYS
                </div>
                <div v-if="filteredLast30Days.length === 0" class="no-results">
                    No results to display
                </div>
                <div v-else>
                    <div 
                        v-for="report in filteredLast30Days" 
                        :key="report"
                        class="sidebar-item"
                        @click="openReport(report)"
                    >
                        {{ report }}
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content - User Profile -->
        <div class="main-content" :class="{ shifted: sidebarOpen }">
            <!-- Profile Avatar -->
            <div class="profile-avatar">
                <svg viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>

            <!-- Profile Information Container -->
            <div class="profile-container">
                <div class="profile-field">
                    <label>Name</label>
                    <span>: {{ fullName }}</span>
                </div>
                <div class="profile-field">
                    <label>Email</label>
                    <span>: {{ email }}</span>
                </div>
                <div class="profile-field">
                    <label>Password</label>
                    <span>: {{ passwordMasked }}</span>
                </div>
                <div class="profile-field">
                    <label>Role</label>
                    <span>: {{ role }}</span>
                </div>

                <!-- 2FA Authentication Toggle Checkbox -->
                <div class="twofa-checkbox">
                    <input 
                        type="checkbox" 
                        id="enable-2fa" 
                        v-model="enableTwoFactor"
                    >
                    <label for="enable-2fa">Enable two-factor authentication</label>
                </div>

                <!-- Profile Action Buttons -->
                <div class="profile-actions">
                    <button class="action-button" @click="grantAdminAccess">GRANT ADMIN ACCESS</button>
                    <button class="action-button delete" @click="deleteAccount">DELETE ACCOUNT</button>
                </div>
            </div>
        </div>

        <!-- Delete Account OTP + Success Modal -->
        <div v-if="step === 'otp' || step === 'success'" class="otp-overlay">

            <div class="otp-modal">

                <!-- OTP Verification View -->
                <div v-if="step === 'otp'">

                    <h2>Verify Account Deletion</h2>
                    <p><br>An OTP has been sent to your registered email.</p>

                    <transition name="fade">
                        <div v-if="message.text"
                            class="message-banner"
                            :class="message.type">
                            {{ message.text }}
                        </div>
                    </transition>

                    <otp-verification 
                        :email="userEmail"
                        @verified="handleDeleteVerified">
                    </otp-verification>

                </div>

                <!-- Success Confirmation View -->
                <div v-if="step === 'success'" class="success-step">

                    <h3 class="success-title">Account Deleted Successfully</h3>

                </div>

            </div>

        </div>

        <!-- Webpage Background Element -->
        <div class="wavy-background">
            <img src="img5.png" alt="Curly Line Design">
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        /*
        CyberComply Profile Page Section
        Manages user profile display, and account settings
        */
        const app = createApp({
        data() {
            return {
                // UI State
                step: 'profile', // profile | otp | success
                message: { text: '', type: '' }, // Notification messages
                sidebarOpen: false, // Sidebar visibility state
                
                // User Data
                userName: 'James S',
                fullName: 'James Smith',
                userEmail: sessionStorage.getItem('userEmail') || '',
                email: sessionStorage.getItem('userEmail') || 'James@gmail.com',
                role: sessionStorage.getItem('userRole') || 'General User',
                passwordMasked: 'Pa***********',
                
                searchActive: false, // Search input visibility
                searchQuery: '', // Current search query
                
                // Document Lists
                last7Days: ['Curtin Report', 'IFS Report', 'Pearson Report', 'Wiley Report'],
                last30Days: ['Example Report', 'Example Report', 'Example Report', 'Example Report', 'Example Report', 'Example Report', 'Example Report', 'Example Report'],
                
                // Filtered Document Lists
                filteredLast7Days: [],
                filteredLast30Days: [],

                enableTwoFactor: false, // 2FA preference
                showOtpModal: false // Modal State
            }
        },

        /*
        Lifecycle hook - component mounted
        */
        mounted() {
                // Initialize filtered lists
                this.filteredLast7Days = [...this.last7Days];
                this.filteredLast30Days = [...this.last30Days];

                // Assigns User Role
                this.assignRoleFromEmail();
            },
            mounted() {
                // Initialize filtered lists
                this.filteredLast7Days = [...this.last7Days];
                this.filteredLast30Days = [...this.last30Days];
            },
            methods: {
                // Toggles sidebar open/close state
                toggleSidebar() {
                    this.sidebarOpen = !this.sidebarOpen;
                },
                // Navigates to report viewing page
                openReport(reportName) {
                    window.location.href = `report_viewing.html?report=${encodeURIComponent(reportName)}`;
                },
                // Handles user logout
                logout() {
                    alert('Logging out...');
                    window.location.href = 'welcome.html';
                },
                // Navigates to admin access granting page
                grantAdminAccess() {
                    window.location.href = 'adminaccess.html';
                },
                // Initiation of account deletion process
                // Shows OTP verification modal
                deleteAccount() {
                    this.step = 'otp';
                    this.message = {
                        text: '',
                        type: 'success'
                    };
                },
                // Handles successful OTP verification for account deletion
                handleDeleteVerified() {

                    // simulate account deletion
                    localStorage.clear();

                    this.step = 'success';

                    setTimeout(() => {
                        window.location.href = 'welcome.html';
                    }, 2200);
                },
                // Toggles search input visibility
                // Resets search query when hiding
                toggleSearch() {
                    this.searchActive = !this.searchActive;
                    if (!this.searchActive) {
                        this.searchQuery = '';
                        this.filterReports();
                    }
                },
                // Navigates back to previous page
                goToHome() {
                    window.history.back();
                },
                // Filters report lists based on search query
                filterReports() {
                    const query = this.searchQuery.toLowerCase();
                    if (query === '') {
                        this.filteredLast7Days = [...this.last7Days];
                        this.filteredLast30Days = [...this.last30Days];
                    } else {
                        this.filteredLast7Days = this.last7Days.filter(report => 
                            report.toLowerCase().includes(query)
                        );
                        this.filteredLast30Days = this.last30Days.filter(report => 
                            report.toLowerCase().includes(query)
                        );
                    }
                },
                // Assigns user role
                assignRoleFromEmail() {
                    const storedRole = sessionStorage.getItem('userRole');
                    const storedEmail = sessionStorage.getItem('userEmail');

                    // Example rule — change to your real logic later
                    if (storedRole) {
                        this.role = storedRole;
                    }

                    if (storedEmail) {
                        this.email = storedEmail;
                    }
                },
                toggleSearch() {
                    this.searchActive = !this.searchActive;
                    if (!this.searchActive) {
                        this.searchQuery = '';
                        this.filterReports();
                    }
                },
                goToHome() {
                    window.history.back();
                },
                filterReports() {
                    const query = this.searchQuery.toLowerCase();
                    if (query === '') {
                        this.filteredLast7Days = [...this.last7Days];
                        this.filteredLast30Days = [...this.last30Days];
                    } else {
                        this.filteredLast7Days = this.last7Days.filter(report => 
                            report.toLowerCase().includes(query)
                        );
                        this.filteredLast30Days = this.last30Days.filter(report => 
                            report.toLowerCase().includes(query)
                        );
                    }
                }
            }
        });
        registerOtpComponent(app);

        // mount
        app.mount('#app');
    </script>
</body>
</html>
