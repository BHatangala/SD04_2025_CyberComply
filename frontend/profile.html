<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberComply - Profile</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.3.4/dist/vue.global.js"></script>
    <script src="otp_component.js"></script>
    <script src="sidebar_component.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #101726;
            color: #ffffff;
            overflow-x: hidden;
        }

        #app {
            position: relative;
            min-height: 100vh;
        }

        /* === HEADER === */
        .top-header {
            background-color: #1a2845;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            position: fixed;       
            top: 0;                
            left: 0;                
            width: 100%;            
            z-index: 100;
        }

        .menu-icon {
            cursor: pointer;
            font-size: 24px;
            color: #8b9dc3;
            transition: color 0.3s;
        }

        .menu-icon:hover {
            color: #ffffff;
        }

        /* Back navigation arrow */
        .back-arrow {
            position: absolute;
            left: 30px;
            top: 80px;
            cursor: pointer;
            font-size: 32px;
            color: #8b9dc3;
            transition: all 0.3s;
            font-weight: 300;
            z-index: 95;
        }

        /* Tooltip for back arrow */
        .back-arrow::after {
            content: "Back to Previous Page";
            position: absolute;
            left: 40px;
            top: 50%;
            transform: translateY(-50%);
            background: #1a2845;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .back-arrow:hover::after {
            opacity: 1;
        }

        .back-arrow.shifted {
            left: 310px;
        }

        .back-arrow:hover {
            color: #ffffff;
        }

        /* User profile avatar in header */
        .user-profile {
            position: absolute;
            right: 30px;
            width: 50px;
            height: 50px;
            background-color: #ffffff;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #2a3f5f;
            transition: transform 0.3s, border-color 0.3s;
        }

        .user-profile:hover {
            transform: scale(1.05);
            border-color: #4a8fe7;
        }

        .user-profile svg {
            width: 30px;
            height: 30px;
            fill: #1a2845;
        }

        /* === MAIN CONTENT AREA === */
        .main-content {
            transition: margin-left 0.3s ease-in-out;
            padding: 80px 80px 60px;
            position: relative;
            z-index: 1;
        }

        .main-content.shifted {
            margin-left: 280px;
        }

        /* Profile avatar */
        .profile-avatar {
            text-align: center;
            margin-bottom: 28px;
        }

        .profile-avatar svg {
            width: 120px;
            height: 120px;
            fill: #ffffff;
            filter: drop-shadow(0 4px 12px rgba(74, 143, 231, 0.4));
        }

        /* Profile Details Section */
        .profile-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px;
            background: linear-gradient(135deg, #1e3a5f 0%, #2a4a7c 100%);
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(74, 143, 231, 0.2);
        }

        .profile-field {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .profile-field label {
            width: 150px;
            color: #c5d0e6;
            font-weight: 500;
        }

        .profile-field span {
            color: #ffffff;
        }

        /* Profile action buttons */
        .profile-actions {
            display: flex;
            justify-content: space-between;
            gap: 100px;
            margin-top: 40px;
        }

        .action-button {
            flex: 1;
            min-width: 0;
            padding: 14px 20px;
            background-color: #ffffff;
            color: #1a2845;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            text-align: center;
        }

        .action-button:hover {
            background-color: #f0f0f0;
            transform: translateY(-2px);
        }

        .action-button.delete {
            background-color: #ffffff;
            color: #1a2845;
        }

        /* Logout Button */
        .logout-button {
            position: absolute;
            top: 15px;
            right: 100px;
            padding: 8px 24px;
            background-color: #ffffff;
            color: #1a2845;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .logout-button:hover {
            background-color: #f0f0f0;
        }

        /* === BACKGROUND ELEMENTS === */
        .wavy-background {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 70%;
            z-index: 0;
            opacity: 0.7;
            pointer-events: none;
        }

        .wavy-background img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 2FA checkbox */
        .twofa-checkbox {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0 32px;
            font-size: 16px;
            color: #c5d0e6;
        }

        .twofa-checkbox input[type="checkbox"] {
            appearance: none;
            width: 20px;
            height: 20px;
            background: #1e3a5f;
            border: 2px solid #4a8fe7;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }

        .twofa-checkbox input[type="checkbox"]:checked {
            background: #4a8fe7;
            border-color: #4a8fe7;
        }

        .twofa-checkbox input[type="checkbox"]:checked::after {
            content: "✓";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .twofa-checkbox label {
            cursor: pointer;
            user-select: none;
        }

        /* === MODAL STYLES === */
        .otp-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            backdrop-filter: blur(4px);
        }

        .otp-modal {
            background: linear-gradient(135deg, #1e3a5f 0%, #2a4a7c 100%);
            border-radius: 16px;
            padding: 40px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            text-align: center;
        }

        .otp-modal h3 {
            margin-bottom: 24px;
            font-size: 22px;
            color: #ffffff;
        }

        .otp-modal p {
            color: #c5d0e6;
            margin-bottom: 28px;
            font-size: 15px;
        }

        /* === RESPONSIVE DESIGN === */
        @media screen and (max-width: 1200px) {
            .sidebar {
                position: fixed;
                box-shadow: 4px 0 20px rgba(0, 0, 0, 0.5);
            }
            
            .main-content.shifted {
                margin-left: 0;  /* Don't push content on smaller screens */
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Top Header Section -->
        <div class="top-header">
            <div class="menu-icon" @click="sidebarOpen = !sidebarOpen">●●●</div>
            <button class="logout-button" @click="logout">LOGOUT</button>
        </div>

        <!-- Back Arrow Navigation -->
        <div class="back-arrow" :class="{ shifted: sidebarOpen }" @click="goToHome">←</div>

        <!-- Sidebar Navigation -->
        <cybercomply-sidebar
            :sidebar-open="sidebarOpen"
            @toggle="sidebarOpen = !sidebarOpen"
        ></cybercomply-sidebar>

        <!-- Main Content - User Profile -->
        <div class="main-content" :class="{ shifted: sidebarOpen }">
            <!-- Profile Avatar -->
            <div class="profile-avatar">
                <svg viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>

            <!-- Profile Information Container -->
            <div class="profile-container">
                <div class="profile-field">
                    <label>Name</label>
                    <span>: {{ fullName }}</span>
                </div>
                <div class="profile-field">
                    <label>Email</label>
                    <span>: {{ email }}</span>
                </div>
                <div class="profile-field">
                    <label>Password</label>
                    <span>: {{ passwordMasked }}</span>
                </div>
                <div class="profile-field">
                    <label>Role</label>
                    <span>: {{ role }}</span>
                </div>

                <!-- 2FA Authentication Toggle Checkbox -->
                <div class="twofa-checkbox">
                    <input 
                        type="checkbox" 
                        id="enable-2fa" 
                        v-model="enableTwoFactor"
                    >
                    <label for="enable-2fa">Enable two-factor authentication</label>
                </div>

                <!-- Profile Action Buttons -->
                <div class="profile-actions">
                    <button class="action-button" @click="grantAdminAccess">GRANT ADMIN ACCESS</button>
                    <button class="action-button delete" @click="deleteAccount">DELETE ACCOUNT</button>
                </div>
            </div>
        </div>

        <!-- Delete Account OTP + Success Modal -->
        <div v-if="step === 'otp' || step === 'success'" class="otp-overlay">

            <div class="otp-modal">

                <!-- OTP Verification View -->
                <div v-if="step === 'otp'">

                    <h2>Verify Account Deletion</h2>
                    <p><br>An OTP has been sent to your registered email.</p>

                    <transition name="fade">
                        <div v-if="message.text"
                            class="message-banner"
                            :class="message.type">
                            {{ message.text }}
                        </div>
                    </transition>

                    <otp-verification 
                        :email="userEmail"
                        @verified="handleDeleteVerified">
                    </otp-verification>

                </div>

                <!-- Success Confirmation View -->
                <div v-if="step === 'success'" class="success-step">

                    <h3 class="success-title">Account Deleted Successfully</h3>

                </div>

            </div>

        </div>

        <!-- Webpage Background Element -->
        <div class="wavy-background">
            <img src="img5.png" alt="Curly Line Design">
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        /*
        CyberComply Profile Page Section
        Manages user profile display, and account settings
        */
        const app = createApp({
        data() {
            return {
                // UI State
                step: 'profile', // profile | otp | success
                message: { text: '', type: '' }, // Notification messages
                sidebarOpen: true, // Sidebar visibility state
                
                // User Data
                userName: 'James S',
                fullName: 'James Smith',
                userEmail: sessionStorage.getItem('userEmail') || '',
                email: sessionStorage.getItem('userEmail') || 'James@gmail.com',
                role: sessionStorage.getItem('userRole') || 'General User',
                passwordMasked: 'Pa***********',

                enableTwoFactor: false, // 2FA preference
                showOtpModal: false // Modal State
            }
        },

        /*
        Lifecycle hook - component mounted
        */
        mounted() {
                // Initialize filtered lists
                this.filteredLast7Days = [...this.last7Days];
                this.filteredLast30Days = [...this.last30Days];

                // Assigns User Role
                this.assignRoleFromEmail();
            },
            mounted() {
                // Initialize filtered lists
                this.filteredLast7Days = [...this.last7Days];
                this.filteredLast30Days = [...this.last30Days];
            },
            methods: {
                // Toggles sidebar open/close state
                toggleSidebar() {
                    this.sidebarOpen = !this.sidebarOpen;
                },
                // Handles user logout
                async logout() {
                    //Delete all uploaded files from S3 before logging out
                    const fileNames = JSON.parse(sessionStorage.getItem('uploadedFileNames') || '[]');
    
                    if (fileNames.length > 0) {
                        try {
                            await fetch('http://127.0.0.1:8000/api/delete-all-files/', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ file_names: fileNames })
                            });
                        } catch (error) {
                            console.error('Failed to delete files on logout:', error);
                        }
                    }

                    sessionStorage.clear();
                    window.location.href = 'welcome.html';
                },
                // Navigates to admin access granting page
                grantAdminAccess() {
                    window.location.href = 'adminaccess.html';
                },
                // Initiation of account deletion process
                // Shows OTP verification modal
                deleteAccount() {
                    this.step = 'otp';
                    this.message = {
                        text: '',
                        type: 'success'
                    };
                },
                // Handles successful OTP verification for account deletion
                handleDeleteVerified() {

                    // simulate account deletion
                    localStorage.clear();

                    this.step = 'success';

                    setTimeout(() => {
                        window.location.href = 'welcome.html';
                    }, 2200);
                },
                // Navigates back to previous page
                goToHome() {
                    window.history.back();
                },
                // Assigns user role
                assignRoleFromEmail() {
                    const storedRole = sessionStorage.getItem('userRole');
                    const storedEmail = sessionStorage.getItem('userEmail');

                    // Example rule — change to your real logic later
                    if (storedRole) {
                        this.role = storedRole;
                    }

                    if (storedEmail) {
                        this.email = storedEmail;
                    }
                },
            }
        });
        registerOtpComponent(app);
        registerSidebarComponent(app);
        app.mount('#app');
    </script>
</body>
</html>
