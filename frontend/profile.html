<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberComply - Profile</title>
    <!-- Vue.js 3 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3.3.4/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #101726;
            color: #f0f4ff;
            overflow-x: hidden;
            overflow-y: auto;
        }

        #app {
            position: relative;
            min-height: 100vh;
        }

        /* === HEADER === */
        .top-header {
            background-color: #1a2845;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            position: relative;
            z-index: 100;
        }

        .menu-icon {
            cursor: pointer;
            font-size: 24px;
            color: #8b9dc3;
            transition: color 0.3s;
        }

        .menu-icon:hover {
            color: #ffffff;
        }

        /* Back Navigation */
        .back-arrow {
            position: absolute;
            left: 30px;
            top: 80px;
            cursor: pointer;
            font-size: 32px;
            color: #8b9dc3;
            transition: all 0.3s;
            font-weight: 300;
            z-index: 95;
        }

        .back-arrow.shifted {
            left: 310px;
        }

        .back-arrow:hover {
            color: #ffffff;
        }

        /* User profile avatar in header */
        .user-profile {
            position: absolute;
            right: 30px;
            width: 50px;
            height: 50px;
            background-color: #ffffff;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #2a3f5f;
            transition: transform 0.3s, border-color 0.3s;
        }

        .user-profile:hover {
            transform: scale(1.05);
            border-color: #4a8fe7;
        }

        .user-profile svg {
            width: 30px;
            height: 30px;
            fill: #1a2845;
        }

        /* === SIDEBAR STYLES === */
        .sidebar {
            position: absolute;
            left: 0;
            top: 60px;
            width: 280px;
            height: calc(100vh - 60px);
            background-color: #0d1420;
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
            z-index: 90;
            overflow-y: auto;
            padding: 20px 0;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.3);
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-section {
            margin-bottom: 30px;
        }

        .sidebar-header {
            padding: 10px 20px;
            font-size: 11px;
            font-weight: 600;
            color: #6b7a99;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header svg {
            width: 14px;
            height: 14px;
            fill: #6b7a99;
        }

        .sidebar-item {
            padding: 12px 20px;
            color: #c5d0e6;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            font-size: 14px;
        }

        .sidebar-item:hover {
            background-color: #1a2845;
            border-left-color: #4a8fe7;
            color: #ffffff;
        }

        /* Icon bar in sidebar */
        .sidebar-icon-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0px 10px 15px 10px; 
            margin-bottom: 20px;
            border-bottom: 2px solid #1a2845;
        }

        .sidebar-icon {
            width: 45px;
            height: 45px;
            background-color: #1a2845;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .sidebar-icon:hover {
            background-color: #2a4a7c;
            transform: scale(1.05);
        }

        .sidebar-icon svg {
            width: 22px;
            height: 22px;
            fill: #8b9dc3;
            transition: fill 0.3s;
        }

        .sidebar-icon:hover svg {
            fill: #ffffff;
        }

        /* Search Input Container */
        .search-container {
            padding: 0 20px 20px;
            display: none;
        }

        .search-container.active {
            display: block;
        }

        .search-input {
            width: 100%;
            padding: 10px 15px;
            background-color: #1a2845;
            border: 2px solid #2a4a7c;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #4a8fe7;
        }

        .search-input::placeholder {
            color: #6b7a99;
        }

        .no-results {
            padding: 12px 20px;
            color: #6b7a99;
            font-size: 12px;
            font-style: italic;
        }

        /* === MAIN CONTENT AREA === */
        .main-content {
            transition: margin-left 0.3s ease-in-out;
            padding: 60px 40px 60px;
            position: relative;
            z-index: 1;
        }

        .main-content.shifted {
            margin-left: 280px;
        }

        /* Profile avatar */
        .profile-avatar {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-avatar svg {
            width: 100px;
            height: 100px;
            fill: #ffffff;
            filter: drop-shadow(0 6px 14px rgba(255, 255, 255, 0.12));
        }

        /* Profile Details Section */
        .profile-container {
            max-width: 820px;
            margin: 0 auto;
            padding: 55px 70px;
            background: rgba(26, 40, 69, 0.85);
            border-radius: 18px;
            border: 1px solid rgba(120,160,255,0.25);
            backdrop-filter: blur(10px);
            box-shadow:
                0 25px 60px rgba(0,0,0,0.55),
                0 0 25px rgba(90,140,255,0.18);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .profile-container:hover {
            transform: translateY(-4px);
            box-shadow:
                0 25px 55px rgba(0,0,0,0.65),
                0 0 35px rgba(74,143,231,0.25);
        }

        .profile-field {
            display: grid;
            grid-template-columns: 160px 20px 1fr 30px;
            align-items: center;
            margin-bottom: 24px;
        }

        .profile-colon {
            text-align: center;
            color: #8fb5ff;
            line-height: 1;
        }

        .profile-value {
            color: #f0f4ff;
            padding-left: 8px;
            font-size: 16px;
        }

        .profile-field label {
            width: 150px;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        .profile-field span {
            color: #f0f4ff;
            font-size: 15px;
        }

        .edit-icon {
            cursor: pointer;
            color: #8b9dc3;
            font-size: 18px;
            transition: color 0.3s;
            justify-self: end;
        }

        .edit-icon:hover { color: #4a8fe7; }
        
        .profile-input {
            background: rgba(255,255,255,0.1);
            border: 1px solid #4a8fe7;
            border-radius: 4px;
            color: #fff;
            padding: 8px 12px;
            font-size: 15px;
            width: 100%;
            outline: none;
        }

        .profile-input:focus {
            border-color: #8fb5ff;
            box-shadow: 0 0 10px rgba(74,143,231,0.3);
        }

        .save-container {
            display: flex;
            justify-content: flex-end;
            margin: 30px 0 20px;
        }

        .save-button {
            background: #4a8fe7;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .save-button:hover:not(:disabled) { background: #5d9ef0; transform: translateY(-2px); }
        .save-button:disabled { opacity: 0.6; cursor: not-allowed; }

        .save-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Profile action buttons */
        .profile-actions {
            display: flex;
            justify-content: space-between;
            gap: 22px;
            margin-top: 28px;
        }

        .action-button {
            flex: 1;
            padding: 14px;
            background: #ffffff;
            color: #1a2845;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 6px 14px rgba(0,0,0,0.25);
        }

        .action-button:hover {
            transform: translateY(-2px);
            background: #f5f7ff;

            box-shadow:
                0 0 12px rgba(140, 180, 255, 0.6),
                0 0 25px rgba(140, 180, 255, 0.35),
                0 10px 20px rgba(0,0,0,0.35);
        }

        .action-button.delete {
            background-color: #ffffff;
            color: #123456;
        }

        /* Logout Button */
        .logout-button {
            position: absolute;
            top: 15px;
            right: 30px;
            padding: 10px 18px;
            background-color: #a2b8c8;
            color: #123456;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .logout-button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 0 10px rgba(140,180,255,0.5),
                0 0 18px rgba(140,180,255,0.3);
        }

        /* === BACKGROUND ELEMENTS === */
        .wavy-background {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 70%;
            z-index: 0;
            opacity: 0.7;
            pointer-events: none;
        }

        .wavy-background img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* === Scrollbar Styling === */
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: #0d1420;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: #2a4a7c;
            border-radius: 3px;
        }

        .sidebar::-webkit-scrollbar-thumb:hover {
            background: #4a8fe7;
        }

        /* 2FA checkbox */
        .twofa-checkbox {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 34px;
            margin-bottom: 24px;
            font-size: 14px;
            color: #ffffff;
        }

        .twofa-checkbox input[type="checkbox"] {
            appearance: none;
            width: 18px;
            height: 18px;
            background: #ffffff;
            border: 1px solid #020f2b;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }

        .twofa-checkbox input[type="checkbox"]:checked {
            background: #ffffff;
            border-color: #020f2b;
        }

        .twofa-checkbox input[type="checkbox"]:checked::after {
            content: "✓";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #10315d;
            font-size: 12px;
            font-weight: bold;
        }

        .twofa-checkbox label {
            cursor: pointer;
            user-select: none;
        }

        /* Password row alignment */
        .password-field {
            align-items: center;
        }

        .password-inline {
            display: flex;
            align-items: center;
            gap: 22px;
            padding-left: 6px;
        }

        .password-mask {
            font-size: 15px;
            letter-spacing: 2px;
            color: #f0f4ff;
        }

        .change-password-btn {
            background: none;
            border: none;
            color: #8ED0FF;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            transition: color 0.2s ease;
        }

        .change-password-btn:hover {
            color: #b4d8ef;
            text-decoration: underline;
        }

        .edit-actions {
            display: flex;
            gap: 8px;
            margin-left: 12px;
        }

        .cancel-btn {
            background: transparent;
            border: 1px solid #6b7a99;
            color: #6b7a99;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .cancel-btn:hover {
            background: rgba(107,122,153,0.1);
            color: #fff;
        }

        .cancel-icon {
            cursor: pointer;
            color: #8b9dc3;
            font-size: 18px;
            transition: color 0.3s;
        }
        .cancel-icon:hover {
            color: #ff6b6b;
        }

        /* === RESPONSIVE DESIGN === */
        @media screen and (max-width: 1200px) {
            .sidebar {
                position: fixed;
                box-shadow: 4px 0 20px rgba(0, 0, 0, 0.5);
            }
            
            .main-content.shifted {
                margin-left: 0;  /* Don't push content on smaller screens */
            }
        }

    </style>
</head>
<body>
    <div id="app">
        <!-- Top Header Section -->
        <div class="top-header">
            <div class="menu-icon" @click="toggleSidebar">●●●</div>
            <button class="logout-button" @click="logout">LOGOUT</button>
        </div>

        <!-- Back Arrow Navigation -->
        <div class="back-arrow" :class="{ shifted: sidebarOpen }" @click="goToHome">←</div>

        <!-- Sidebar Navigation -->
        <div class="sidebar" :class="{ open: sidebarOpen }">
            <!-- Icon Bar (with Search and Plus) -->
            <div class="sidebar-icon-bar">
                <div class="sidebar-icon" @click="toggleSearch" title="Search documents">
                    <svg viewBox="0 0 24 24">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                </div>
                <div class="sidebar-icon" @click="goToHome" title="Start new analysis">
                    <svg viewBox="0 0 24 24">
                        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                    </svg>
                </div>
            </div>

            <!-- Search Input Field (Hidden by default) -->
            <div class="search-container" :class="{ active: searchActive }">
                <input 
                    type="text" 
                    class="search-input" 
                    v-model="searchQuery" 
                    placeholder="Search documents..."
                    @input="filterReports"
                >
            </div>

            <!-- Last 7 Days Reports Section -->
            <div class="sidebar-section">
                <div class="sidebar-header">
                    <svg viewBox="0 0 24 24">
                        <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
                    </svg>
                    LAST 7 DAYS
                </div>
                <div v-if="filteredLast7Days.length === 0" class="no-results">
                    No results to display
                </div>
                <div v-else>
                    <div 
                        v-for="report in filteredLast7Days" 
                        :key="report"
                        class="sidebar-item"
                        @click="openReport(report)"
                    >
                        {{ report }}
                    </div>
                </div>
            </div>

            <!-- Last 30 Days Reports Section -->
            <div class="sidebar-section">
                <div class="sidebar-header">
                    <svg viewBox="0 0 24 24">
                        <path d="M9 11H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm2-7h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/>
                    </svg>
                    LAST 30 DAYS
                </div>
                <div v-if="filteredLast30Days.length === 0" class="no-results">
                    No results to display
                </div>
                <div v-else>
                    <div 
                        v-for="report in filteredLast30Days" 
                        :key="report"
                        class="sidebar-item"
                        @click="openReport(report)"
                    >
                        {{ report }}
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content - User Profile -->
        <div class="main-content" :class="{ shifted: sidebarOpen }">

            <!-- Profile Avatar -->
            <div class="profile-avatar">
                <svg viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>

            <!-- Profile Information Container -->
            <div class="profile-container">
                <!-- Name -->
                <div class="profile-field">
                    <label>Name</label>
                    <span class="profile-colon">:</span>
                    <div v-if="editingField !== 'name'" class="profile-value">{{ fullName }}</div>
                    <div v-else class="flex items-center">
                        <input type="text" v-model="editedFullName" class="profile-input"
                            @keyup.enter="saveField('name')" @keyup.esc="cancelEdit('name')" ref="nameInput">
                        <span class="cancel-icon" @click="cancelEdit('name')" title="Cancel">✕</span>
                    </div>
                    <span class="edit-icon" @click="startEditing('name')" v-if="editingField !== 'name'">✎</span>
                </div>

                <!-- Email -->
                <div class="profile-field">
                    <label>Email</label>
                    <span class="profile-colon">:</span>
                    <div v-if="editingField !== 'email'" class="profile-value">{{ email }}</div>
                    <div v-else class="flex items-center">
                        <input type="email" v-model="editedEmail" class="profile-input"
                            @keyup.enter="saveField('email')" @keyup.esc="cancelEdit('email')" ref="emailInput">
                        <span class="cancel-icon" @click="cancelEdit('email')" title="Cancel">✕</span>
                    </div>
                    <span class="edit-icon" @click="startEditing('email')" v-if="editingField !== 'email'">✎</span>
                </div>

                <!-- Password -->
                <div class="profile-field password-field">
                    <label>Password</label>
                    <span class="profile-colon">:</span>
                    <div class="password-inline">
                        <span class="password-mask">**************</span>
                        <span class="edit-icon" @click="goToResetPassword" title="Change Password">✎</span>
                    </div>
                </div>

                <!-- Role -->
                <div class="profile-field">
                    <label>Role</label>
                    <span class="profile-colon">:</span>
                    <span class="profile-value">{{ roleDisplay }}</span>
                </div>

                <!-- Save button (only when changes exist) -->
                <div class="save-container" v-if="hasChanges">
                    <button class="save-button" @click="confirmSave" :disabled="isSaving">
                        <span v-if="isSaving" class="save-spinner"></span>
                        {{ isSaving ? 'SAVING...' : 'SAVE CHANGES' }}
                    </button>
                </div>

                <!-- 2FA Authentication Toggle Checkbox -->
                <div class="twofa-checkbox">
                    <input 
                        type="checkbox" 
                        id="enable-2fa" 
                        v-model="enableTwoFactor"
                        @change="updateTwoFactorSetting"
                    >
                    <label for="enable-2fa">Enable two-factor authentication</label>
                </div>

                <!-- Profile Action Buttons -->
                <div class="profile-actions">
                    <button class="action-button" @click="grantAdminAccess">GRANT ADMIN ACCESS</button>
                    <button class="action-button delete" @click="deleteAccount">DELETE ACCOUNT</button>
                </div>
            </div>
        </div>

        <!-- Webpage Background Element -->
        <div class="wavy-background">
            <img src="img5.png" alt="Curly Line Design">
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        /*
        CyberComply Profile Page Section
        Manages user profile display, and account settings
        */
        const app = createApp({
        data() {
            return {
                sidebarOpen: false, // Sidebar visibility state
                
                // User Data
                fullName: '',
                email: '',
                role: '',
                originalFullName: '',
                originalEmail: '',
                editedFullName: '',
                editedEmail: '',
                tempFullName: '',
                tempEmail: '',
                editingField: null,
                hasChanges: false,
                isSaving: false,
                
                searchActive: false, // Search input visibility
                searchQuery: '', // Current search query
                
                // Document Lists
                last7Days: ['Curtin Report', 'IFS Report', 'Pearson Report', 'Wiley Report'],
                last30Days: ['Example Report', 'Example Report', 'Example Report', 'Example Report', 'Example Report', 'Example Report', 'Example Report', 'Example Report'],
                
                // Filtered Document Lists
                filteredLast7Days: [],
                filteredLast30Days: [],

                enableTwoFactor: false, // 2FA preference
            }
        },

        /*
        Lifecycle hook - component mounted
        */
        computed: {
                roleDisplay() {
                    const role = (this.role || "").toLowerCase();
                    if (role.includes("administrative")) return "Administrative User";
                    if (role.includes("general")) return "General User";
                    return "General User";
                }
            },
        watch: {
                editedFullName(newVal) {
                    this.hasChanges = newVal !== this.originalFullName;
                },
                editedEmail(newVal) {
                    this.hasChanges = newVal !== this.originalEmail;
                }
            },
        async mounted() {
                // Initialize filtered lists
                this.filteredLast7Days = [...this.last7Days];
                this.filteredLast30Days = [...this.last30Days];

                // Fetch latest profile details from backend
                await this.loadUserProfile();
            },
            
            methods: {
                // Toggles sidebar open/close state
                toggleSidebar() {
                    this.sidebarOpen = !this.sidebarOpen;
                },
                // Navigates to report viewing page
                openReport(reportName) {
                    window.location.href = `report_viewing.html?report=${encodeURIComponent(reportName)}`;
                },

                async loadUserProfile() {
                    const email = sessionStorage.getItem('userEmail');
                    if (!email) {
                        Swal.fire({
                            icon: 'error',
                            title: 'Not logged in',
                            text: 'Redirecting to login...',
                            timer: 2000,
                            showConfirmButton: false
                        });
                        setTimeout(() => window.location.href = 'login.html', 2000);
                        return;
                    }

                    try {
                        const res = await fetch(`http://127.0.0.1:8000/api/profile/?email=${encodeURIComponent(email)}`);
                        if (!res.ok) throw new Error('Failed to load profile');
                        const data = await res.json();

                        this.fullName = this.originalFullName = data.full_name;
                        this.email = this.originalEmail = data.email;
                        this.role = data.role;
                        this.enableTwoFactor = data.otp_is_enabled;

                        this.editedFullName = data.full_name;
                        this.editedEmail = data.email;

                        sessionStorage.setItem('userFullName', data.full_name);
                        sessionStorage.setItem('userEmail', data.email);
                    } catch (err) {
                        console.error('Profile load failed:', err);
                        Swal.fire({
                            icon: 'error',
                            title: 'Failed to load profile',
                            text: 'Please try again or contact support.',
                            timer: 4000,
                            showConfirmButton: false
                        });
                    }
                },

                saveField(field) {
                    this.editingField = null;
                },

                async confirmSave() {
                    const nameChanged = this.editedFullName.trim() !== this.originalFullName;
                    const emailChanged = this.editedEmail.trim().toLowerCase() !== this.originalEmail;

                    // If no changes at all → shouldn't happen due to v-if="hasChanges"
                    if (!nameChanged && !emailChanged) return;

                    // Validate name if changed
                    if (nameChanged && this.editedFullName.trim().length < 3) {
                        return Swal.fire({
                            icon: 'error',
                            title: 'Invalid Name',
                            text: 'Name must be at least 3 characters'
                        });
                    }

                    // Validate email if changed
                    if (emailChanged && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(this.editedEmail)) {
                        return Swal.fire({
                            icon: 'error',
                            title: 'Invalid Email',
                            text: 'Please enter a valid email address'
                        });
                    }

                    const result = await Swal.fire({
                        title: emailChanged ? 'Change Email?' : 'Save Changes?',
                        text: emailChanged 
                            ? 'A verification code will be sent to the new email address.' 
                            : 'Save profile changes?',
                        icon: 'question',
                        showCancelButton: true,
                        confirmButtonColor: '#4a8fe7',
                        confirmButtonText: 'Yes'
                    });

                    if (!result.isConfirmed) return;

                    this.isSaving = true;

                    try {
                        // Step 1: If name changed → save it immediately (PATCH)
                        if (nameChanged) {
                            const res = await fetch('http://127.0.0.1:8000/api/profile/update/', {
                                method: 'PATCH',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ 
                                    email: this.email,  // Add this line - your backend needs the email
                                    full_name: this.editedFullName.trim() 
                                })
                            });
                            if (!res.ok) {
                                const err = await res.json();
                                throw new Error(err.detail || 'Name update failed');
                            }
                            const data = await res.json();
                            this.fullName = this.originalFullName = data.full_name;
                            sessionStorage.setItem('userFullName', data.full_name);

                            // Reset temp values after successful name save
                            this.tempFullName = '';
                        }

                        // Step 2: If email changed → redirect to OTP page
                        if (emailChanged) {
                            sessionStorage.setItem('pendingNewEmail', this.editedEmail.trim().toLowerCase());
                            // Reset temp values before redirect
                            this.tempEmail = '';
                            // Show a brief loading message before redirect
                            Swal.fire({
                                title: 'Redirecting...',
                                text: 'Taking you to email verification',
                                timer: 1000,
                                showConfirmButton: false,
                                didOpen: () => Swal.showLoading()
                            }).then(() => {
                                window.location.href = 'email_change_verify.html';
                            });
                            return;
                        }

                        // If only name changed (or both but name first)
                        this.hasChanges = false;
                        this.editingField = null;
                        this.tempFullName = '';
                        this.tempEmail = '';
                        Swal.fire({
                            icon: 'success',
                            title: 'Saved!',
                            timer: 1500,
                            showConfirmButton: false
                        });
                    } catch (err) {
                        Swal.fire({
                            icon: 'error',
                            title: 'Failed',
                            text: err.message || 'Could not save changes'
                        });
                    } finally {
                        this.isSaving = false;
                    }
                },

                async saveNameOnly() {
                    this.isSaving = true;
                    try {
                        const res = await fetch('http://127.0.0.1:8000/api/profile/update/', {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ full_name: this.editedFullName.trim() })
                        });
                        if (!res.ok) throw new Error('Update failed');
                        const data = await res.json();

                        this.fullName = this.originalFullName = data.full_name;
                        sessionStorage.setItem('userFullName', data.full_name);
                        this.hasChanges = false;
                        this.editingField = null;
                        Swal.fire({ icon: 'success', title: 'Saved!', timer: 1500, showConfirmButton: false });
                    } catch (err) {
                        Swal.fire({
                            icon: 'error',
                            title: 'Failed',
                            text: err.message || 'Could not save changes'
                        });
                    } finally {
                        this.isSaving = false;
                    }
                },

                startEditing(field) {
                    // Store current value as temp backup for cancel
                    if (field === 'name') this.tempFullName = this.editedFullName;
                    if (field === 'email') this.tempEmail = this.editedEmail;

                    this.editingField = field;
                    this.$nextTick(() => {
                        const input = this.$refs[field + 'Input'];
                        if (input) {
                            input.focus();
                            input.select(); // Highlight text for easy overwrite
                        }
                    });
                },

                cancelEdit(field) {
                    // Revert to original/previous value
                    if (field === 'name') {
                        this.editedFullName = this.tempFullName || this.originalFullName;
                        this.tempFullName = '';
                    }
                    if (field === 'email') {
                        this.editedEmail = this.tempEmail || this.originalEmail;
                        this.tempEmail = '';
                    }

                    this.editingField = null;
                    this.hasChanges = false; // Reset if no real change
                },

                async updateTwoFactorSetting() {
                    try {
                        const response = await fetch('http://127.0.0.1:8000/api/profile/twofa/', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                email: this.email,
                                otp_is_enabled: this.enableTwoFactor
                            })
                        });

                        const data = await response.json();

                        if (!response.ok) {
                            alert(data.detail || 'Failed to update two-factor authentication setting.');
                            this.enableTwoFactor = !this.enableTwoFactor;
                            return;
                        }

                        console.log(data.detail);
                    } catch (error) {
                        console.error('Error updating 2FA setting:', error);
                        alert('Something went wrong while updating two-factor authentication.');
                        this.enableTwoFactor = !this.enableTwoFactor;
                    }
                },

                // Handles user logout
                async logout() {
                    //Delete all uploaded files from S3 before logging out
                    const fileNames = JSON.parse(sessionStorage.getItem('uploadedFileNames') || '[]');
    
                    if (fileNames.length > 0) {
                        try {
                            await fetch('http://127.0.0.1:8000/api/delete-file/', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ file_names: fileNames })
                            });
                        } catch (error) {
                            console.error('Failed to delete files on logout:', error);
                        }
                    }

                    sessionStorage.clear();
                    window.location.href = 'welcome.html';
                },
                // Navigates to admin access granting page
                grantAdminAccess() {
                    window.location.href = 'adminaccess.html';
                },
                // Navigate to forgot password page
                goToResetPassword() {
                    window.location.href = "forgot_password.html";
                },
                // Initiation of account deletion process
                // Shows OTP verification modal
                async deleteAccount() {
                    try {
                        const response = await fetch('http://127.0.0.1:8000/api/request-delete-account/', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                email: this.email
                            })
                        });

                        const data = await response.json();

                        if (!response.ok) {
                            alert(data.detail || 'Failed to send delete account OTP.');
                            return;
                        }

                        sessionStorage.setItem("deleteAccountMessage", "A verification code has been sent to your email.");
                        window.location.href = 'delete_account_verify.html';

                    } catch (error) {
                        console.error('Error requesting delete account OTP:', error);
                        alert('Something went wrong while requesting the verification code.');
                    }
                },
                
                // Toggles search input visibility
                // Resets search query when hiding
                toggleSearch() {
                    this.searchActive = !this.searchActive;
                    if (!this.searchActive) {
                        this.searchQuery = '';
                        this.filterReports();
                    }
                },
                // Navigates back to previous page
                goToHome() {
                    window.history.back();
                },
                // Filters report lists based on search query
                filterReports() {
                    const query = this.searchQuery.toLowerCase();
                    if (query === '') {
                        this.filteredLast7Days = [...this.last7Days];
                        this.filteredLast30Days = [...this.last30Days];
                    } else {
                        this.filteredLast7Days = this.last7Days.filter(report => 
                            report.toLowerCase().includes(query)
                        );
                        this.filteredLast30Days = this.last30Days.filter(report => 
                            report.toLowerCase().includes(query)
                        );
                    }
                },
            }
        });

        // mount
        app.mount('#app');
    </script>
</body>
</html>
